<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#08070a">
<meta name="description" content="POPCORE — an idle popcorn chain-reaction game.">
<title>POPCORE</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>🍿</text></svg>">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">

  <header id="hud">
    <div class="hud-left">
      <div id="money" class="money">$0</div>
      <div id="rate" class="rate">$0.0 / s</div>
    </div>
    <div class="hud-right">
      <div id="butter" class="butter">🧈 0</div>
      <div id="best" class="best">BEST CHAIN —</div>
      <button id="mute" class="icon-btn" type="button" aria-label="Toggle sound">SOUND ON</button>
    </div>
  </header>

  <main id="stage">
    <canvas id="game"></canvas>
    <div id="chain" class="chain" aria-live="off"></div>
    <div id="callout" class="callout" aria-hidden="true"></div>
    <div id="hint" class="hint">TAP THE KERNEL</div>
  </main>

  <button id="mega" class="mega" type="button" disabled>
    <span id="megaFill" class="mega-fill"></span>
    <span id="megaLabel" class="mega-label">MEGA POP</span>
  </button>

  <section id="upgrades" class="upgrades"></section>

  <section id="bottom" class="bottom">
    <button id="deckBtn" class="bar-btn" type="button">
      <span class="bar-title">DECK</span>
      <span id="deckSub" class="bar-sub">next card in 30 pops</span>
    </button>
    <button id="cashBtn" class="bar-btn cash" type="button">
      <span class="bar-title">CASH OUT</span>
      <span id="cashSub" class="bar-sub">🧈 0</span>
    </button>
  </section>

  <footer id="footer">
    <span id="pops">0 pops</span>
    <button id="reset" class="text-btn" type="button">reset save</button>
  </footer>

  <!-- Card draft: the run-defining choice, so it takes over the screen. -->
  <div id="draft" class="overlay" hidden>
    <div class="overlay-inner">
      <div class="overlay-eyebrow">MUTATION</div>
      <h2 class="overlay-title">PICK ONE</h2>
      <div id="draftCards" class="cards"></div>
    </div>
  </div>

  <div id="deck" class="overlay" hidden>
    <div class="overlay-inner">
      <div class="overlay-eyebrow">THIS BATCH</div>
      <h2 class="overlay-title">YOUR DECK</h2>
      <div id="deckList" class="deck-list"></div>
      <button class="close-btn" type="button" data-close="deck">CLOSE</button>
    </div>
  </div>

  <div id="shop" class="overlay" hidden>
    <div class="overlay-inner">
      <div class="overlay-eyebrow">PERMANENT</div>
      <h2 class="overlay-title">BUTTER SHOP</h2>
      <div id="shopButter" class="shop-butter">🧈 0</div>
      <div id="shopList" class="shop-list"></div>
      <button class="close-btn" type="button" data-close="shop">CLOSE</button>
    </div>
  </div>

  <div id="cashout" class="overlay" hidden>
    <div class="overlay-inner">
      <div class="overlay-eyebrow">BATCH COMPLETE</div>
      <h2 class="overlay-title">CASH OUT</h2>
      <div id="cashSummary" class="cash-summary"></div>
      <div class="overlay-actions">
        <button id="cashConfirm" class="primary-btn" type="button">POP THE BATCH</button>
        <button class="close-btn" type="button" data-close="cashout">KEEP POPPING</button>
      </div>
    </div>
  </div>

  <div id="welcome" class="overlay" hidden>
    <div class="overlay-inner">
      <div class="overlay-eyebrow">WHILE YOU WERE GONE</div>
      <h2 class="overlay-title">THE PAN KEPT POPPING</h2>
      <div id="welcomeSummary" class="cash-summary"></div>
      <button id="welcomeClaim" class="primary-btn" type="button">COLLECT</button>
    </div>
  </div>

</div>

<script src="js/config.js"></script>
<script src="js/cards.js"></script>
<script src="js/meta.js"></script>
<script src="js/sim.js"></script>
<script src="js/fx.js"></script>
<script src="js/audio.js"></script>
<script src="js/render.js"></script>
<script src="js/ui.js"></script>
<script src="js/save.js"></script>
<script src="js/main.js"></script>
</body>
</html>
