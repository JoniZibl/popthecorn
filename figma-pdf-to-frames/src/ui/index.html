<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <style>
      :root {
        color-scheme: light dark;
        font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 11px;
      }
      body {
        margin: 0;
        padding: 12px;
        color: var(--figma-color-text, #1e1e1e);
        background: var(--figma-color-bg, #fff);
      }
      .drop {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 4px;
        height: 96px;
        border: 1px dashed var(--figma-color-border, #d9d9d9);
        border-radius: 6px;
        cursor: pointer;
        text-align: center;
      }
      .drop.is-over {
        border-color: var(--figma-color-border-selected, #0d99ff);
        background: var(--figma-color-bg-selected, #e5f4ff);
      }
      .drop small {
        color: var(--figma-color-text-secondary, #777);
      }
      fieldset {
        margin: 12px 0 0;
        padding: 8px 10px;
        border: 1px solid var(--figma-color-border, #e6e6e6);
        border-radius: 6px;
      }
      legend {
        padding: 0 4px;
        color: var(--figma-color-text-secondary, #777);
      }
      label.row {
        display: flex;
        align-items: baseline;
        gap: 6px;
        padding: 3px 0;
      }
      label.row small {
        color: var(--figma-color-text-secondary, #777);
      }
      input[type="text"] {
        width: 100%;
        box-sizing: border-box;
        margin-top: 6px;
        padding: 5px 6px;
        border: 1px solid var(--figma-color-border, #e6e6e6);
        border-radius: 4px;
        background: transparent;
        color: inherit;
        font: inherit;
      }
      input[type="text"]:disabled {
        opacity: 0.4;
      }
      progress {
        width: 100%;
        height: 4px;
        margin-top: 12px;
      }
      #status {
        margin: 8px 0 0;
        min-height: 2.6em;
        color: var(--figma-color-text-secondary, #777);
      }
      #status.is-error {
        color: var(--figma-color-text-danger, #d3241e);
      }
      [hidden] {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <label class="drop" id="drop">
      <input type="file" id="file" accept="application/pdf,.pdf" hidden />
      <strong>PDF auswählen</strong>
      <small>oder hierher ziehen</small>
    </label>

    <fieldset>
      <legend>Modus</legend>
      <label class="row">
        <input type="radio" name="mode" value="vector" checked />
        <span>Vektor <small>— alles aus dem SVG, schnellster Weg</small></span>
      </label>
      <label class="row">
        <input type="radio" name="mode" value="hybrid" />
        <span>Vektor + echter Text <small>— beste Bearbeitbarkeit</small></span>
      </label>
      <label class="row">
        <input type="radio" name="mode" value="image" />
        <span>Bild <small>— Fallback für Scans, nicht editierbar</small></span>
      </label>
    </fieldset>

    <fieldset>
      <legend>Seiten</legend>
      <label class="row">
        <input type="checkbox" id="all-pages" checked />
        <span>alle Seiten</span>
      </label>
      <input type="text" id="range" placeholder="z. B. 1-3,7,12-14" disabled />
    </fieldset>

    <progress id="progress" max="100" value="0" hidden></progress>
    <p id="status"></p>

    <!--PDFJS-->
    <!--BUNDLE-->
  </body>
</html>
