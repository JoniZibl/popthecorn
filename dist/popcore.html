<title>POPCORE</title>
<style>
/* POPCORE — mobile-first layout. Dark, warm, minimal. */

:root {
  color-scheme: dark;
  --bg: #08070a;
  --bg-2: #100d13;
  --line: rgba(255, 255, 255, 0.08);
  --text: #f6f1e8;
  --dim: rgba(246, 241, 232, 0.45);
  --gold: #ffc24b;
  --orange: #ff7a18;
  --cream: #fff6e2;
  --ok: #7ee08a;
  --pad: 12px;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
  margin: 0;
  height: 100%;
  overflow: hidden;
  background: var(--bg);
  color: var(--text);
  font-family: ui-rounded, "SF Pro Rounded", "Segoe UI", system-ui, -apple-system, sans-serif;
  font-variant-numeric: tabular-nums;
  user-select: none;
  -webkit-user-select: none;
  touch-action: manipulation;
  overscroll-behavior: none;
}

#app {
  display: flex;
  flex-direction: column;
  height: 100dvh;
  max-width: 560px;
  margin: 0 auto;
  padding: max(8px, env(safe-area-inset-top)) var(--pad) max(8px, env(safe-area-inset-bottom));
  gap: 8px;
}

/* ---------------- HUD ---------------- */

#hud {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 8px;
  flex: 0 0 auto;
}

.money {
  font-size: clamp(26px, 8vw, 38px);
  font-weight: 800;
  letter-spacing: -0.02em;
  line-height: 1;
  color: var(--cream);
  text-shadow: 0 0 24px rgba(255, 178, 60, 0.35);
  transform-origin: left center;   /* scale is driven per-frame from ui.js */
  will-change: transform;
}

.rate {
  margin-top: 4px;
  font-size: 12px;
  letter-spacing: 0.08em;
  color: var(--dim);
}

.hud-right {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 6px;
}

.best {
  font-size: 11px;
  letter-spacing: 0.12em;
  color: var(--dim);
}

.icon-btn, .text-btn {
  background: transparent;
  border: 1px solid var(--line);
  color: var(--dim);
  border-radius: 999px;
  padding: 5px 10px;
  font: inherit;
  font-size: 10px;
  letter-spacing: 0.12em;
  cursor: pointer;
}
.icon-btn:active, .text-btn:active { transform: scale(0.95); }
.icon-btn:focus-visible, .text-btn:focus-visible,
.up:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.text-btn.armed { color: #ff8a4b; border-color: rgba(255, 122, 24, 0.6); }

/* ---------------- Stage ---------------- */

#stage {
  position: relative;
  flex: 1 1 auto;
  min-height: 0;
}

#game {
  display: block;
  width: 100%;
  height: 100%;
  touch-action: none;
}

.chain {
  position: absolute;
  white-space: nowrap;
  left: 0;
  right: 0;
  top: 6%;
  text-align: center;
  pointer-events: none;
  font-weight: 900;
  font-size: clamp(26px, 8vw, 32px);
  letter-spacing: 0.02em;
  color: var(--gold);
  opacity: 0;
  transform: scale(0.7);
  text-shadow: 0 0 20px rgba(255, 140, 30, 0.55);
  will-change: transform, opacity;
}
.chain.on { opacity: 1; }
.chain.pulse { animation: chain-pop 260ms cubic-bezier(0.2, 1.6, 0.4, 1) both; }

@keyframes chain-pop {
  0%   { transform: scale(0.72) rotate(-2deg); }
  55%  { transform: scale(1.22) rotate(1.5deg); }
  100% { transform: scale(1) rotate(0deg); }
}

/* Escalating chain tiers */
.chain.t1 { color: var(--gold); font-size: clamp(30px, 9vw, 36px); }
.chain.t2 { color: #ffa53d; font-size: clamp(34px, 10.5vw, 42px); text-shadow: 0 0 26px rgba(255, 140, 30, 0.8); }
.chain.t3 { color: #ff7a18; font-size: clamp(38px, 12vw, 48px); text-shadow: 0 0 34px rgba(255, 90, 10, 0.95); }
.chain.t4 { color: #fff2c4; font-size: clamp(42px, 13.5vw, 56px); text-shadow: 0 0 44px rgba(255, 210, 90, 1), 0 0 90px rgba(255, 90, 10, 0.8); }

.hint {
  position: absolute;
  left: 0; right: 0; bottom: 0;
  text-align: center;
  font-size: 11px;
  letter-spacing: 0.22em;
  color: var(--dim);
  pointer-events: none;
  animation: hint-breathe 2.4s ease-in-out infinite;
  transition: opacity 400ms ease;
}
.hint.hide { opacity: 0; animation: none; }

@keyframes hint-breathe {
  0%, 100% { opacity: 0.35; }
  50% { opacity: 0.85; }
}

/* ---------------- Callout ---------------- */

.callout {
  position: absolute;
  left: 0; right: 0;
  top: 34%;
  text-align: center;
  pointer-events: none;
  font-weight: 900;
  font-style: italic;
  font-size: clamp(34px, 13vw, 62px);
  letter-spacing: -0.02em;
  white-space: nowrap;
  color: #fff3d0;
  text-shadow: 0 0 30px rgba(255, 150, 30, 0.95), 0 6px 0 rgba(180, 60, 0, 0.35);
  opacity: 0;
  will-change: transform, opacity;
}
.callout.go { animation: callout-slam 900ms cubic-bezier(0.15, 1.5, 0.4, 1) both; }

@keyframes callout-slam {
  0%   { opacity: 0; transform: scale(2.4) rotate(-9deg); }
  16%  { opacity: 1; transform: scale(0.92) rotate(-3deg); }
  30%  { transform: scale(1.06) rotate(-4deg); }
  70%  { opacity: 1; transform: scale(1) rotate(-3deg); }
  100% { opacity: 0; transform: scale(1.25) translateY(-26px) rotate(-3deg); }
}

/* ---------------- MEGA POP ---------------- */

.mega {
  position: relative;
  overflow: hidden;
  flex: 0 0 auto;
  height: 46px;
  border-radius: 14px;
  border: 1px solid rgba(255, 255, 255, 0.1);
  background: rgba(255, 255, 255, 0.035);
  color: var(--dim);
  font: inherit;
  font-weight: 900;
  letter-spacing: 0.18em;
  cursor: default;
  transition: transform 90ms ease, color 160ms ease, border-color 160ms ease;
}
.mega-fill {
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 0%;
  background: linear-gradient(90deg, rgba(255, 122, 24, 0.55), rgba(255, 194, 75, 0.75));
  transition: width 160ms linear;
}
.mega-label {
  position: relative;
  display: grid;
  place-items: center;
  height: 100%;
  font-size: 13px;
}
.mega.ready {
  cursor: pointer;
  color: #1a0d02;
  border-color: rgba(255, 214, 110, 0.9);
  animation: mega-throb 620ms ease-in-out infinite;
}
.mega.ready .mega-fill {
  background: linear-gradient(90deg, #ff7a18, #ffd76a, #ff7a18);
}
.mega.ready:active { transform: scale(0.97); }
.mega.fired { animation: mega-fired 420ms ease-out; }

@keyframes mega-throb {
  0%, 100% { box-shadow: 0 0 0 rgba(255, 170, 40, 0); }
  50% { box-shadow: 0 0 26px rgba(255, 170, 40, 0.75); }
}
@keyframes mega-fired {
  0% { transform: scale(1.04); filter: brightness(2.2); }
  100% { transform: scale(1); filter: brightness(1); }
}

/* ---------------- Upgrades ---------------- */

.upgrades {
  flex: 0 0 auto;
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 8px;
}

.up {
  position: relative;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  gap: 3px;
  padding: 9px 10px;
  border-radius: 14px;
  border: 1px solid var(--line);
  background: linear-gradient(180deg, rgba(255, 255, 255, 0.045), rgba(255, 255, 255, 0.015));
  color: var(--text);
  font: inherit;
  text-align: left;
  cursor: pointer;
  transition: transform 90ms ease, border-color 160ms ease, background 160ms ease;
}
.up:disabled { cursor: default; opacity: 0.55; }
.up:not(:disabled) { border-color: rgba(255, 194, 75, 0.42); }
.up:not(:disabled):active { transform: scale(0.97); }
.up.flash { animation: up-flash 420ms ease-out; }

@keyframes up-flash {
  0% { background: rgba(255, 194, 75, 0.55); }
  100% { background: linear-gradient(180deg, rgba(255, 255, 255, 0.045), rgba(255, 255, 255, 0.015)); }
}

.up-top {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 6px;
}
.up-name {
  font-size: clamp(11px, 3.4vw, 13px);
  font-weight: 700;
  letter-spacing: 0.02em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.up-lvl {
  flex: 0 0 auto;
  font-size: 10px;
  color: var(--dim);
  letter-spacing: 0.08em;
  white-space: nowrap;
}
.up-val {
  font-size: 10px;
  white-space: nowrap;
  color: rgba(246, 241, 232, 0.6);
  letter-spacing: 0.04em;
}
.up-cost {
  font-size: 13px;
  font-weight: 800;
  color: var(--dim);
  letter-spacing: 0.02em;
}
.up:not(:disabled) .up-cost { color: var(--gold); }

/* progress toward affording the next level */
.up-bar {
  position: absolute;
  left: 0; bottom: 0;
  height: 2px;
  background: linear-gradient(90deg, var(--orange), var(--gold));
  opacity: 0.75;
  transition: width 180ms linear;
}

/* ---------------- Bottom bar ---------------- */

.bottom {
  flex: 0 0 auto;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}

.bar-btn {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 2px;
  padding: 8px 10px;
  border-radius: 12px;
  border: 1px solid var(--line);
  background: rgba(255, 255, 255, 0.03);
  color: var(--text);
  font: inherit;
  text-align: left;
  cursor: pointer;
}
.bar-btn:active { transform: scale(0.98); }
.bar-title { font-size: 11px; font-weight: 800; letter-spacing: 0.14em; }
.bar-sub { font-size: 10px; color: var(--dim); letter-spacing: 0.04em; }

.bar-btn.cash.ready {
  border-color: rgba(255, 214, 110, 0.75);
  background: rgba(255, 180, 60, 0.12);
}
.bar-btn.cash.ready .bar-sub { color: var(--gold); }

.butter {
  font-size: 13px;
  font-weight: 800;
  color: #ffd98a;
  letter-spacing: 0.04em;
}

/* ---------------- Overlays ---------------- */

/* `display: grid` below outranks the browser's own [hidden] rule, so a hidden
   overlay would otherwise stay on screen and swallow every tap. */
.overlay[hidden] { display: none; }

.overlay {
  position: fixed;
  inset: 0;
  z-index: 20;
  display: grid;
  place-items: center;
  padding: 18px;
  background: rgba(6, 5, 8, 0.93);
  backdrop-filter: blur(3px);
  animation: overlay-in 180ms ease-out;
}

@keyframes overlay-in { from { opacity: 0; } to { opacity: 1; } }

.overlay-inner {
  width: 100%;
  max-width: 460px;
  max-height: 100%;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.overlay-eyebrow {
  font-size: 10px;
  letter-spacing: 0.28em;
  color: var(--dim);
  text-align: center;
}
.overlay-title {
  margin: 0 0 4px;
  text-align: center;
  font-size: clamp(24px, 8vw, 32px);
  font-weight: 900;
  letter-spacing: -0.01em;
  color: var(--cream);
  text-shadow: 0 0 26px rgba(255, 160, 40, 0.4);
}

/* draft cards */

.cards { display: flex; flex-direction: column; gap: 8px; }

.card {
  position: relative;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  gap: 4px;
  padding: 12px 14px;
  border-radius: 14px;
  border: 1px solid var(--rarity, var(--line));
  background: linear-gradient(135deg, rgba(255, 255, 255, 0.06), rgba(255, 255, 255, 0.02));
  color: var(--text);
  font: inherit;
  text-align: left;
  cursor: pointer;
  animation: card-in 320ms cubic-bezier(0.2, 1.3, 0.4, 1) both;
}
.card:nth-child(2) { animation-delay: 70ms; }
.card:nth-child(3) { animation-delay: 140ms; }
.card:nth-child(4) { animation-delay: 210ms; }
.card:nth-child(5) { animation-delay: 280ms; }
.card:active { transform: scale(0.98); }

@keyframes card-in {
  from { opacity: 0; transform: translateY(18px) scale(0.96); }
  to   { opacity: 1; transform: none; }
}

.card-rarity {
  font-size: 9px;
  letter-spacing: 0.22em;
  color: var(--rarity, var(--dim));
}
.card-name { font-size: 17px; font-weight: 800; letter-spacing: -0.01em; }
.card-desc { font-size: 12px; color: rgba(246, 241, 232, 0.7); line-height: 1.35; }
.card.legendary {
  background: linear-gradient(135deg, rgba(255, 140, 30, 0.18), rgba(255, 255, 255, 0.02));
  box-shadow: 0 0 30px rgba(255, 140, 30, 0.25);
}

/* deck + shop lists */

.deck-list, .shop-list { display: flex; flex-direction: column; gap: 6px; }

.deck-row {
  display: flex;
  align-items: baseline;
  gap: 8px;
  padding: 8px 10px;
  border-radius: 10px;
  background: rgba(255, 255, 255, 0.035);
  border-left: 3px solid var(--rarity, var(--line));
}
.deck-row .n { font-size: 13px; font-weight: 700; }
.deck-row .d { font-size: 11px; color: var(--dim); }
.deck-empty { text-align: center; color: var(--dim); font-size: 12px; padding: 14px; }

.shop-butter {
  text-align: center;
  font-size: 20px;
  font-weight: 900;
  color: #ffd98a;
}
.shop-next {
  margin-top: 3px;
  font-size: 10px;
  font-weight: 500;
  letter-spacing: 0.06em;
  color: var(--dim);
}

.shop-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 10px 12px;
  border-radius: 12px;
  border: 1px solid var(--line);
  background: rgba(255, 255, 255, 0.03);
  color: var(--text);
  font: inherit;
  text-align: left;
  cursor: pointer;
}
.shop-row:disabled { opacity: 0.5; cursor: default; }
.shop-row:not(:disabled) { border-color: rgba(255, 194, 75, 0.45); }
.shop-row .sn { font-size: 13px; font-weight: 800; }
.shop-row .sd { font-size: 11px; color: var(--dim); }
.shop-row .sv { font-size: 11px; color: rgba(255, 217, 138, 0.85); }
.shop-row .sc { font-size: 14px; font-weight: 900; color: #ffd98a; white-space: nowrap; }

/* cash-out + welcome */

.cash-summary {
  display: flex;
  flex-direction: column;
  gap: 6px;
  padding: 14px;
  border-radius: 14px;
  background: rgba(255, 255, 255, 0.04);
  font-size: 13px;
}
.cash-summary .row { display: flex; justify-content: space-between; gap: 10px; }
.cash-summary .row span:last-child { font-weight: 800; }
.cash-summary .big {
  font-size: 30px;
  font-weight: 900;
  text-align: center;
  color: #ffd98a;
  padding: 4px 0;
}

.overlay-actions { display: flex; flex-direction: column; gap: 8px; }

.primary-btn {
  padding: 14px;
  border: none;
  border-radius: 14px;
  background: linear-gradient(90deg, #ff7a18, #ffc24b);
  color: #1a0d02;
  font: inherit;
  font-size: 14px;
  font-weight: 900;
  letter-spacing: 0.14em;
  cursor: pointer;
}
.primary-btn:active { transform: scale(0.98); }
.primary-btn:disabled { opacity: 0.45; cursor: default; }

.close-btn {
  padding: 11px;
  border-radius: 12px;
  border: 1px solid var(--line);
  background: transparent;
  color: var(--dim);
  font: inherit;
  font-size: 11px;
  letter-spacing: 0.16em;
  cursor: pointer;
}

/* ---------------- Footer ---------------- */

#footer {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 10px;
  letter-spacing: 0.12em;
  color: rgba(246, 241, 232, 0.28);
}

@media (min-height: 720px) {
  .upgrades { gap: 10px; }
  .up { padding: 12px; }
}

@media (prefers-reduced-motion: reduce) {
  .chain.pulse, .hint, .mega.ready, .card { animation: none; }
  .callout.go { animation-duration: 600ms; }
}
</style>

<div id="app">

  <header id="hud">

    <div class="hud-right">
      <div id="butter" class="butter">🧈 0</div>
      <div id="best" class="best">BEST CHAIN —</div>

  <main id="stage">

  </main>

  <button id="mega" class="mega" type="button" disabled>

  <section id="upgrades" class="upgrades"></section>

  <section id="bottom" class="bottom">

    <button id="cashBtn" class="bar-btn cash" type="button">
      <span class="bar-title">CASH OUT</span>

  </section>

  <footer id="footer">
    <span id="pops">0 pops</span>
    <button id="reset" class="text-btn" type="button">reset save</button>

  <!-- Card draft: the run-defining choice, so it takes over the screen. -->
  <div id="draft" class="overlay" hidden>
    <div class="overlay-inner">
      <div class="overlay-eyebrow">MUTATION</div>
      <h2 class="overlay-title">PICK ONE</h2>

    </div>
  </div>

  <div id="deck" class="overlay" hidden>
    <div class="overlay-inner">
      <div class="overlay-eyebrow">THIS BATCH</div>
      <h2 class="overlay-title">YOUR DECK</h2>
      <div id="deckList" class="deck-list"></div>
      <button class="close-btn" type="button" data-close="deck">CLOSE</button>
    </div>
  </div>

  <div id="shop" class="overlay" hidden>
    <div class="overlay-inner">
      <div class="overlay-eyebrow">PERMANENT</div>
      <h2 class="overlay-title">BUTTER SHOP</h2>
      <div id="shopButter" class="shop-butter">🧈 0</div>
      <div id="shopList" class="shop-list"></div>
      <button class="close-btn" type="button" data-close="shop">CLOSE</button>
    </div>
  </div>

  <div id="cashout" class="overlay" hidden>
    <div class="overlay-inner">
      <div class="overlay-eyebrow">BATCH COMPLETE</div>
      <h2 class="overlay-title">CASH OUT</h2>
      <div id="cashSummary" class="cash-summary"></div>
      <div class="overlay-actions">
        <button id="cashConfirm" class="primary-btn" type="button">POP THE BATCH</button>
        <button class="close-btn" type="button" data-close="cashout">KEEP POPPING</button>
      </div>
    </div>
  </div>

  <div id="welcome" class="overlay" hidden>
    <div class="overlay-inner">
      <div class="overlay-eyebrow">WHILE YOU WERE GONE</div>
      <h2 class="overlay-title">THE PAN KEPT POPPING</h2>
      <div id="welcomeSummary" class="cash-summary"></div>
      <button id="welcomeClaim" class="primary-btn" type="button">COLLECT</button>
    </div>
  </div>

</div>

<script>
/**
 * POPCORE — balance & tuning constants.
 *
 * Everything gameplay-facing lives here so the numbers can be tweaked without
 * touching simulation or rendering code.
 *
 * Simulation space is normalized: the pan is a circle of radius 1 centred on
 * (0, 0). The renderer maps that to pixels, so balance is resolution
 * independent.
 */
window.POPCORE = window.POPCORE || {};

POPCORE.CONFIG = {
  /* ---- world ---- */
  PAN_RADIUS: 1,
  SPAWN_RADIUS: 0.84,       // kernels spawn inside this, keeping clear of the rim
  KERNEL_RADIUS: 0.07,      // base kernel size in pan units
  MAX_KERNELS: 46,          // hard cap: keeps the pan readable and the sim cheap
  TAP_RADIUS: 0.11,         // forgiving touch radius (fat-finger friendly)
  MAX_SPAWN_RATE: 14,       // ceiling on kernels per second: past this the pan is
                            // an unreadable firehose rather than a game
  MAX_SPAWN_PER_STEP: 4,    // bounds the work done in a single simulation step
  EMPTY_REFILL_DELAY: 0.4,  // how long an empty pan may stay empty before one
                            // kernel is placed regardless of the spawn rate

  /* ---- heat ---- */
  HEAT_JITTER: 0.25,        // per-kernel heat-rate variation (±25%), avoids lockstep
  SHOCK_SPEED: 1.5,         // shockwave expansion speed, pan units / second
  SHOCK_BAND: 0.06,         // ring thickness used for heat hit detection
  MAX_SHOCKWAVES: 45,

  /* ---- chains ----
   * The window tightens as the chain grows: a slow, metronomic tapper can hold
   * a chain of ~10, but only a real cascade (pops ~0.15s apart) can hold 50+.
   * That keeps CHAIN a measure of chain *reactions*, not of tapping stamina.
   */
  CHAIN_WINDOW: 0.7,        // window at chain 1
  CHAIN_WINDOW_MIN: 0.24,   // window a very long chain converges to
  CHAIN_WINDOW_DECAY: 22,   // chain length over which it decays
  CHAIN_BONUS: 0.5,         // per-pop multiplier = 1 + CHAIN_BONUS * sqrt(chain)
  CHAIN_BONUS_CAP: 60,      // …but the chain counts as at most this for that
                            // multiplier. A self-sustaining pan holds a chain
                            // open indefinitely, so without a cap the "burst"
                            // bonus silently becomes a permanent 10x income
                            // multiplier and the economy runs away. Long chains
                            // are rewarded through the end-of-chain bonus
                            // instead, which is where a burst belongs.

  // Milestones are close together at the start so something lands every few
  // seconds, then spread out to keep the top end meaningful.
  CHAIN_MAX: 500,           // a chain this long banks itself: the counter always
                            // means something, and the cap is its own climax
  CHAIN_BONUS_MIN: 8,       // shortest chain that pays an end-of-chain bonus
  CHAIN_BONUS_FACTOR: 0.35, // bonus = popValue * chain * this
  CHAIN_TIERS: [8, 15, 25, 40, 60, 100, 150, 250, 400],
  TIER_WORDS: ['NICE', 'SWEET', 'WILD', 'CRAZY', 'INSANE',
               'UNREAL', 'GODLIKE', 'LEGENDARY', 'COSMIC'],

  /* ---- golden kernels ----
   * A jackpot target that shows up every ~half minute: worth a pile of money,
   * pops with its own callout, and gives the eye something to hunt for.
   */
  GOLDEN_CHANCE: 0.05,          // base odds that a new kernel is golden
  GOLDEN_PER_SPAWN_LEVEL: 0.002, // Spawn Rate keeps paying once the rate caps:
  GOLDEN_MAX_CHANCE: 0.16,       // it buys golden kernels instead
  GOLDEN_MULT: 18,

  /* ---- MEGA POP ----
   * A meter that fills with every pop. When it is full the player gets one
   * screen-clearing wave on demand — a goal that is always a few seconds away.
   */
  MEGA_MAX: 40,             // pops needed to fill the meter
  MEGA_HEAT: 3,             // enough to pop anything the wave touches
  MEGA_RADIUS: 2.3,

  /* ---- away earnings ----
   * Coming back should pay something, without making leaving the best move:
   * a fraction of the rate you left at, over a capped window.
   */
  OFFLINE_RATE: 0.3,
  OFFLINE_MAX_HOURS: 8,
  OFFLINE_MIN_SECONDS: 120,

  /* ---- misc ---- */
  RATE_WINDOW: 6,           // seconds of history behind the "$ / s" readout
  SAVE_INTERVAL: 5,         // seconds between autosaves
  MAX_DT: 0.05,             // clamp for a single simulation step (tab-switch safety)

  /* ---- upgrades ----
   * cost(level)  = baseCost * costMult^level   → exponential, endless progression
   * value(level) feeds the simulation directly.
   *
   * Every cost multiplier is deliberately larger than the matching value
   * multiplier: output per level grows ~1.13 * 1.18 while a level costs ~1.44
   * more, so each purchase takes a little longer than the last instead of the
   * economy running away.
   */
  UPGRADES: [
    {
      id: 'spawn',
      name: 'Spawn Rate',
      baseCost: 12,
      costMult: 1.50,
      value: function (lvl) { return 1.40 * Math.pow(1.15, lvl); },
      format: function (v, lvl) {
        var C = POPCORE.CONFIG;
        var rate = Math.min(v, C.MAX_SPAWN_RATE);
        var gold = Math.min(C.GOLDEN_CHANCE + lvl * C.GOLDEN_PER_SPAWN_LEVEL, C.GOLDEN_MAX_CHANCE);
        return rate.toFixed(2) + '/s · ' + Math.round(gold * 100) + '% gold';
      }
    },
    {
      id: 'heat',
      name: 'Heat Speed',
      baseCost: 14,
      costMult: 1.48,
      value: function (lvl) { return 0.055 * Math.pow(1.10, lvl); },
      format: function (v) { return (1 / v).toFixed(1) + 's to pop'; }
    },
    {
      id: 'shock',
      name: 'Shockwave',
      baseCost: 20,
      costMult: 1.50,
      value: function (lvl) { return 0.30 * Math.pow(1.11, lvl); },
      format: function (v) { return '+' + Math.round(v * 100) + '% heat'; }
    },
    {
      id: 'value',
      name: 'Pop Value',
      baseCost: 12,
      costMult: 1.52,
      value: function (lvl) { return 1 * Math.pow(1.22, lvl); },
      format: function (v) { return '$' + POPCORE.formatMoney(v, true); }
    }
  ],

  /* Shockwave radius grows with the shockwave upgrade but is capped so a single
   * pop can never trivially cover the whole pan too early. */
  shockRadius: function (lvl) {
    return Math.min(0.36 * Math.pow(1.06, lvl), 1.8);
  },

  /** Seconds a chain survives without a pop, at the given chain length. */
  chainWindow: function (chain) {
    var C = POPCORE.CONFIG;
    return C.CHAIN_WINDOW_MIN +
      (C.CHAIN_WINDOW - C.CHAIN_WINDOW_MIN) * Math.exp(-chain / C.CHAIN_WINDOW_DECAY);
  }
};

/* ---- shared helpers ---- */

POPCORE.SUFFIX = ['', 'K', 'M', 'B', 'T', 'Qa', 'Qi', 'Sx', 'Sp', 'Oc', 'No', 'Dc'];

/** Compact money formatting: 1234567 -> "1.23M". */
POPCORE.formatMoney = function (n, short) {
  if (!isFinite(n)) return '∞';
  if (n < 1000) {
    if (short) return n < 10 ? n.toFixed(2) : n.toFixed(0);
    return n < 10 ? n.toFixed(1) : Math.floor(n).toString();
  }
  var tier = Math.floor(Math.log10(n) / 3);
  var suffix = POPCORE.SUFFIX[tier];
  if (!suffix) return n.toExponential(2);
  var scaled = n / Math.pow(1000, tier);
  return (scaled < 10 ? scaled.toFixed(2) : scaled < 100 ? scaled.toFixed(1) : scaled.toFixed(0)) + suffix;
};

POPCORE.clamp = function (v, lo, hi) { return v < lo ? lo : v > hi ? hi : v; };
POPCORE.lerp = function (a, b, t) { return a + (b - a) * t; };
POPCORE.rand = function (a, b) { return a + Math.random() * (b - a); };
</script>

<script>
/**
 * POPCORE — mutation cards.
 *
 * Every batch drafts a random build: at rising pop counts the player is offered
 * three cards and keeps one. Cards stack for the rest of the batch, so no two
 * batches play the same way — one run is a slow-burn high-value pan, the next
 * is a wide-blast chain machine.
 *
 * Cards are pure data. Everything they do is expressed through the modifier
 * fields below, which the simulation multiplies into its own numbers, so a new
 * card needs no new simulation code:
 *
 *   popValue, spawnRate, heatRate, shockHeat, shockRadius,
 *   chainWindow, chainBonus, golden, goldenMult, megaCharge   — multipliers
 *   startHeat      — kernels spawn with this much heat already (0..1)
 *   doublePop      — chance a pop fires a second shockwave and pays twice
 *   chainRadius    — shockwave radius grows by this fraction per chain link
 *
 * `unlockAt` is lifetime butter: the pool keeps growing for months of play.
 */
(function (NS) {
  'use strict';

  NS.RARITY = {
    common:    { label: 'COMMON',    weight: 62, color: '#cfc6b6' },
    rare:      { label: 'RARE',      weight: 30, color: '#5fc9ff' },
    legendary: { label: 'LEGENDARY', weight: 8,  color: '#ff9b3d' }
  };

  NS.CARDS = [
    /* ---- starting pool ---- */
    { id: 'butter', name: 'Butter Coating', rarity: 'common', unlockAt: 0,
      desc: 'Pops pay +60%, kernels arrive 20% slower',
      mods: { popValue: 1.6, spawnRate: 0.8 } },

    { id: 'hotoil', name: 'Hot Oil', rarity: 'common', unlockAt: 0,
      desc: 'Kernels start at 20% heat',
      mods: { startHeat: 0.2 } },

    { id: 'tightpan', name: 'Tight Pan', rarity: 'common', unlockAt: 0,
      desc: '+50% kernels, shockwaves 15% smaller',
      mods: { spawnRate: 1.5, shockRadius: 0.85 } },

    { id: 'slowburn', name: 'Slow Burn', rarity: 'common', unlockAt: 0,
      desc: 'Heat 30% slower, pops pay double',
      mods: { heatRate: 0.7, popValue: 2 } },

    { id: 'wideblast', name: 'Wide Blast', rarity: 'common', unlockAt: 0,
      desc: 'Shockwaves reach 30% further',
      mods: { shockRadius: 1.3 } },

    { id: 'deepheat', name: 'Deep Heat', rarity: 'common', unlockAt: 0,
      desc: 'Shockwaves carry 35% more heat',
      mods: { shockHeat: 1.35 } },

    { id: 'sticky', name: 'Sticky Combo', rarity: 'common', unlockAt: 0,
      desc: 'Chains survive 35% longer',
      mods: { chainWindow: 1.35 } },

    { id: 'salty', name: 'Salted', rarity: 'common', unlockAt: 0,
      desc: 'Chain bonuses pay +50%',
      mods: { chainBonus: 1.5 } },

    { id: 'goldrush', name: 'Gold Rush', rarity: 'rare', unlockAt: 0,
      desc: 'Golden kernels 2.5× as often',
      mods: { golden: 2.5 } },

    /* ---- unlocked by playing ---- */
    { id: 'double', name: 'Double Feature', rarity: 'rare', unlockAt: 15,
      desc: '12% of pops fire twice',
      mods: { doublePop: 0.12 } },

    { id: 'kettle', name: 'Kettle Corn', rarity: 'rare', unlockAt: 35,
      desc: 'MEGA POP charges twice as fast',
      mods: { megaCharge: 2 } },

    { id: 'reactor', name: 'Chain Reactor', rarity: 'rare', unlockAt: 120,
      desc: 'Each chain link widens the next shockwave',
      mods: { chainRadius: 0.014 } },

    { id: 'caramel', name: 'Caramel Bath', rarity: 'rare', unlockAt: 70,
      desc: 'Chain bonuses pay 2.2×, chains end 15% sooner',
      mods: { chainBonus: 2.2, chainWindow: 0.85 } },

    { id: 'airpopper', name: 'Air Popper', rarity: 'rare', unlockAt: 190,
      desc: 'Double the kernels, pops pay 30% less',
      mods: { spawnRate: 2, popValue: 0.7 } },

    { id: 'nuclear', name: 'Nuclear Kernel', rarity: 'legendary', unlockAt: 290,
      desc: 'Shockwaves: double heat, +50% reach. 30% fewer kernels',
      mods: { shockHeat: 2, shockRadius: 1.5, spawnRate: 0.7 } },

    { id: 'midas', name: 'Midas Corn', rarity: 'legendary', unlockAt: 430,
      desc: 'Golden kernels 4× as often and worth 50% more',
      mods: { golden: 4, goldenMult: 1.5 } },

    { id: 'perpetual', name: 'Perpetual Motion', rarity: 'legendary', unlockAt: 620,
      desc: '20% of pops fire twice, chains survive 20% longer',
      mods: { doublePop: 0.2, chainWindow: 1.2 } },

    { id: 'storm', name: 'Butter Storm', rarity: 'legendary', unlockAt: 880,
      desc: 'Pops pay 3×, heat builds 40% slower',
      mods: { popValue: 3, heatRate: 0.6 } },

    /* ---- the long tail ---- */
    { id: 'popping', name: 'Popping Corn', rarity: 'rare', unlockAt: 1200,
      desc: 'Chains survive 50% longer, pops pay 15% less',
      mods: { chainWindow: 1.5, popValue: 0.85 } },

    { id: 'slick', name: 'Oil Slick', rarity: 'rare', unlockAt: 1700,
      desc: 'Shockwaves reach 80% further but carry 25% less heat',
      mods: { shockRadius: 1.8, shockHeat: 0.75 } },

    { id: 'jumbo', name: 'Jumbo Kernels', rarity: 'legendary', unlockAt: 2400,
      desc: 'Pops pay 2.5×, kernels arrive 45% slower',
      mods: { popValue: 2.5, spawnRate: 0.55 } },

    { id: 'static', name: 'Static Charge', rarity: 'legendary', unlockAt: 3300,
      desc: 'Shockwaves widen sharply as the chain climbs',
      mods: { chainRadius: 0.03 } },

    { id: 'goldenage', name: 'Golden Age', rarity: 'legendary', unlockAt: 4500,
      desc: 'Golden kernels 3× as often and worth double, pops pay 20% less',
      mods: { golden: 3, goldenMult: 2, popValue: 0.8 } },

    { id: 'chaos', name: 'Chaos Theory', rarity: 'legendary', unlockAt: 6000,
      desc: '30% of pops fire twice, chains end 10% sooner',
      mods: { doublePop: 0.3, chainWindow: 0.9 } }
  ];

  /** Lifetime butter at which the next locked card opens up, or null. */
  NS.nextUnlock = function (lifetimeButter) {
    var best = null;
    for (var i = 0; i < NS.CARDS.length; i++) {
      var at = NS.CARDS[i].unlockAt;
      if (at > lifetimeButter && (best === null || at < best)) best = at;
    }
    return best;
  };

  NS.cardById = function (id) {
    for (var i = 0; i < NS.CARDS.length; i++) {
      if (NS.CARDS[i].id === id) return NS.CARDS[i];
    }
    return null;
  };

  /** Cards whose unlock threshold the player's lifetime butter has passed. */
  NS.unlockedCards = function (lifetimeButter) {
    return NS.CARDS.filter(function (c) { return lifetimeButter >= c.unlockAt; });
  };

  /**
   * Draw `count` distinct cards, weighted by rarity. `luck` shifts the roll
   * toward the good stuff (the Rare Blend meta upgrade).
   */
  NS.drawCards = function (count, lifetimeButter, luck, exclude) {
    var pool = NS.unlockedCards(lifetimeButter).filter(function (c) {
      return !exclude || exclude.indexOf(c.id) === -1;
    });
    // Falling back to the full unlocked pool beats offering nothing once the
    // player has drafted most of it in a single very long batch.
    if (pool.length < count) pool = NS.unlockedCards(lifetimeButter);

    var picks = [];
    var available = pool.slice();

    while (picks.length < count && available.length) {
      var total = 0, i;
      for (i = 0; i < available.length; i++) total += weightOf(available[i], luck);

      var roll = Math.random() * total;
      var chosen = available.length - 1;
      for (i = 0; i < available.length; i++) {
        roll -= weightOf(available[i], luck);
        if (roll <= 0) { chosen = i; break; }
      }
      picks.push(available[chosen]);
      available.splice(chosen, 1);
    }
    return picks;
  };

  function weightOf(card, luck) {
    var w = NS.RARITY[card.rarity].weight;
    if (card.rarity === 'rare') w *= 1 + (luck || 0) * 0.5;
    if (card.rarity === 'legendary') w *= 1 + (luck || 0);
    return w;
  }

  /** Pop count at which the nth draft (0-based) is offered. */
  NS.draftAt = function (n) {
    return Math.round(30 * Math.pow(1.42, n));
  };
})(window.POPCORE);

<script>
/**
 * POPCORE — the layer above a single batch.
 *
 * A batch is one panful: you pop, upgrade, draft cards, and the numbers run
 * away from you. Cashing out ends the batch and converts everything it earned
 * into BUTTER, the permanent currency. Butter buys upgrades that apply to every
 * future batch and unlocks new cards into the draft pool.
 *
 * That is the long arc: a batch is ten minutes, the butter it leaves behind is
 * forever, and the card pool keeps opening up for months.
 */
(function (NS) {
  'use strict';

  NS.META = {
    /* Butter is logarithmic in what a batch earned: every tenfold increase in
     * batch power is worth the same fixed step. That is what makes the meta
     * layer last — a batch a thousand times stronger than your first pays
     * three steps more, not a thousand times more, so the deep upgrades stay
     * expensive no matter how absurd the in-batch numbers get. */
    BUTTER_PER_DECADE: 2.2,
    BUTTER_LOG_FLOOR: 4,      // a batch under $10k is not worth cashing out

    /* Cashing out below this is refused — it would burn a batch for nothing. */
    MIN_CASHOUT: 1,

    UPGRADES: [
      {
        id: 'slots',
        name: 'Wider Selection',
        desc: 'One more card to choose from at every draft',
        baseCost: 26,
        costMult: 5,
        max: 3,
        format: function (lvl) { return (3 + lvl) + ' cards per draft'; }
      },
      {
        id: 'luck',
        name: 'Rare Blend',
        desc: 'Better odds of rare and legendary cards',
        baseCost: 20,
        costMult: 2.6,
        max: 6,
        format: function (lvl) { return '+' + (lvl * 50) + '% rare odds'; }
      },
      {
        id: 'headstart',
        name: 'Head Start',
        desc: 'Every batch begins with free upgrade levels',
        baseCost: 10,
        costMult: 1.55,
        max: 20,
        format: function (lvl) { return lvl + ' free levels each'; }
      },
      {
        id: 'churn',
        name: 'Butter Churn',
        desc: 'Every batch yields more butter',
        baseCost: 16,
        costMult: 1.7,
        max: 25,
        format: function (lvl) { return '+' + (lvl * 12) + '% butter'; }
      },
      {
        id: 'richer',
        name: 'Deep Fryer',
        desc: 'Permanently raises what every pop pays',
        baseCost: 14,
        costMult: 1.6,
        max: 40,
        format: function (lvl) { return '×' + POPCORE.formatMoney(Math.pow(1.5, lvl), true) + ' pop value'; }
      }
    ]
  };

  function Meta() {
    this.butter = 0;
    this.lifetimeButter = 0;   // drives card unlocks; never spent down
    this.batches = 0;
    this.bestBatch = 0;        // most money earned in a single batch
    this.levels = {};
    for (var i = 0; i < NS.META.UPGRADES.length; i++) this.levels[NS.META.UPGRADES[i].id] = 0;
  }

  Meta.prototype.def = function (id) {
    for (var i = 0; i < NS.META.UPGRADES.length; i++) {
      if (NS.META.UPGRADES[i].id === id) return NS.META.UPGRADES[i];
    }
    return null;
  };

  Meta.prototype.level = function (id) { return this.levels[id] || 0; };

  Meta.prototype.maxed = function (id) {
    var def = this.def(id);
    return this.level(id) >= def.max;
  };

  Meta.prototype.cost = function (id) {
    var def = this.def(id);
    return Math.ceil(def.baseCost * Math.pow(def.costMult, this.level(id)));
  };

  Meta.prototype.canBuy = function (id) {
    return !this.maxed(id) && this.butter >= this.cost(id);
  };

  Meta.prototype.buy = function (id) {
    if (!this.canBuy(id)) return false;
    this.butter -= this.cost(id);
    this.levels[id] = this.level(id) + 1;
    return true;
  };

  /* ---- what the meta layer grants a batch ---- */

  Meta.prototype.cardsPerDraft = function () { return 3 + this.level('slots'); };
  Meta.prototype.luck = function () { return this.level('luck') * 0.5; };
  Meta.prototype.headStart = function () { return this.level('headstart'); };
  Meta.prototype.popValueMult = function () { return Math.pow(1.5, this.level('richer')); };
  Meta.prototype.butterMult = function () { return 1 + this.level('churn') * 0.12; };

  /** Butter a batch that earned `earned` would pay right now. */
  Meta.prototype.butterFor = function (earned) {
    var M = NS.META;
    if (earned <= 0) return 0;
    var decades = Math.log(earned) / Math.LN10 - M.BUTTER_LOG_FLOOR;
    if (decades <= 0) return 0;
    return Math.floor(decades * M.BUTTER_PER_DECADE * this.butterMult());
  };

  Meta.prototype.canCashOut = function (earned) {
    return this.butterFor(earned) >= NS.META.MIN_CASHOUT;
  };

  /** Bank a finished batch. Returns the butter gained. */
  Meta.prototype.cashOut = function (earned) {
    var gain = this.butterFor(earned);
    if (gain < NS.META.MIN_CASHOUT) return 0;
    this.butter += gain;
    this.lifetimeButter += gain;
    this.batches++;
    if (earned > this.bestBatch) this.bestBatch = earned;
    return gain;
  };

  /** How much money is still needed for the next whole point of butter. */
  Meta.prototype.nextButterAt = function (earned) {
    var M = NS.META;
    var target = this.butterFor(earned) + 1;
    var decades = target / (M.BUTTER_PER_DECADE * this.butterMult()) + M.BUTTER_LOG_FLOOR;
    return Math.max(0, Math.pow(10, decades) - earned);
  };

  Meta.prototype.toJSON = function () {
    return {
      butter: this.butter,
      lifetimeButter: this.lifetimeButter,
      batches: this.batches,
      bestBatch: this.bestBatch,
      levels: this.levels
    };
  };

  Meta.prototype.load = function (data) {
    if (!data) return;
    this.butter = Math.max(0, Number(data.butter) || 0);
    this.lifetimeButter = Math.max(0, Number(data.lifetimeButter) || 0);
    this.batches = Math.max(0, Math.floor(Number(data.batches) || 0));
    this.bestBatch = Math.max(0, Number(data.bestBatch) || 0);
    for (var i = 0; i < NS.META.UPGRADES.length; i++) {
      var def = NS.META.UPGRADES[i];
      var lvl = Math.floor(Number(data.levels && data.levels[def.id]) || 0);
      this.levels[def.id] = NS.clamp(lvl, 0, def.max);
    }
  };

  NS.Meta = Meta;
})(window.POPCORE);
</script>

<script>
/**
 * POPCORE — simulation.
 *
 * Pure gameplay state: kernels, heat, shockwaves, chains, money, upgrades.
 * Knows nothing about canvas, DOM or audio. Every frame it drains `events`,
 * which is how the presentation layers learn what happened.
 *
 * Event shapes:
 *   { type:'pop',      x, y, chain, value, manual, golden }
 *   { type:'chainEnd', count }
 *   { type:'tier',     tier, chain, word, x, y }   // chain crossed a milestone
 *   { type:'spawn',    x, y, golden }
 *   { type:'mega' }                                // MEGA POP fired
 *   { type:'card',     id }                        // a mutation card was drafted
 *   { type:'buy',      id, level }
 */
(function (NS) {
  'use strict';

  var C = NS.CONFIG;
  var clamp = NS.clamp;
  var rand = NS.rand;

  var nextId = 1;

  function Sim(meta) {
    this.meta = meta || null;      // may be absent in headless tests
    this.kernels = [];
    this.shockwaves = [];
    this.events = [];

    this.cards = [];               // card ids drafted this batch
    this.mods = defaultMods();
    this.earned = 0;               // money earned this batch, drives butter
    this.runPops = 0;              // pops this batch, drives card drafts
    this.draftsTaken = 0;

    this.money = 0;
    this.totalPops = 0;
    this.bestChain = 0;
    this.levels = {};
    for (var i = 0; i < C.UPGRADES.length; i++) this.levels[C.UPGRADES[i].id] = 0;

    this.mega = 0;           // MEGA POP charge, 0..MEGA_MAX
    this.chain = 0;
    this.chainTimer = 0;
    this.chainTier = 0;      // index into CHAIN_TIERS already announced
    this.time = 0;
    this.spawnAcc = 0;
    this.emptyFor = 0;

    // Rolling earnings history for the "$ / s" readout.
    this._earnings = [];
    this._earned = 0;
  }

  /* ---------------- card modifiers ---------------- */

  function defaultMods() {
    return {
      popValue: 1, spawnRate: 1, heatRate: 1, shockHeat: 1, shockRadius: 1,
      chainWindow: 1, chainBonus: 1, golden: 1, goldenMult: 1, megaCharge: 1,
      startHeat: 0, doublePop: 0, chainRadius: 0
    };
  }

  /** Fold every drafted card (and the permanent meta bonus) into one object. */
  Sim.prototype.recomputeMods = function () {
    var m = defaultMods();

    for (var i = 0; i < this.cards.length; i++) {
      var card = NS.cardById(this.cards[i]);
      if (!card) continue;
      for (var key in card.mods) {
        if (!card.mods.hasOwnProperty(key)) continue;
        // Multiplicative fields start at 1, additive ones at 0.
        if (key === 'startHeat' || key === 'doublePop' || key === 'chainRadius') {
          m[key] += card.mods[key];
        } else {
          m[key] *= card.mods[key];
        }
      }
    }

    if (this.meta) m.popValue *= this.meta.popValueMult();
    m.startHeat = clamp(m.startHeat, 0, 0.9);
    m.doublePop = clamp(m.doublePop, 0, 0.85);

    this.mods = m;
  };

  Sim.prototype.addCard = function (id) {
    this.cards.push(id);
    this.recomputeMods();
    this.events.push({ type: 'card', id: id });
  };

  /** Pops at which the next draft is due, or null once none is pending. */
  Sim.prototype.nextDraftAt = function () { return NS.draftAt(this.draftsTaken); };

  Sim.prototype.draftDue = function () { return this.runPops >= this.nextDraftAt(); };

  /* ---------------- upgrades ---------------- */

  Sim.prototype.level = function (id) { return this.levels[id] || 0; };

  Sim.prototype.upgradeDef = function (id) {
    for (var i = 0; i < C.UPGRADES.length; i++) {
      if (C.UPGRADES[i].id === id) return C.UPGRADES[i];
    }
    return null;
  };

  Sim.prototype.cost = function (id) {
    var def = this.upgradeDef(id);
    return def.baseCost * Math.pow(def.costMult, this.level(id));
  };

  Sim.prototype.canBuy = function (id) { return this.money >= this.cost(id); };

  Sim.prototype.buy = function (id) {
    var price = this.cost(id);
    if (this.money < price) return false;
    this.money -= price;
    this.levels[id] = this.level(id) + 1;
    this.events.push({ type: 'buy', id: id, level: this.levels[id] });
    return true;
  };

  /* Derived stats — read straight from the upgrade table. */
  Sim.prototype.spawnRate = function () {
    var rate = this.upgradeDef('spawn').value(this.level('spawn')) * this.mods.spawnRate;
    return Math.min(rate, C.MAX_SPAWN_RATE);
  };
  Sim.prototype.heatRate = function () {
    return this.upgradeDef('heat').value(this.level('heat')) * this.mods.heatRate;
  };
  Sim.prototype.shockHeat = function () {
    return this.upgradeDef('shock').value(this.level('shock')) * this.mods.shockHeat;
  };
  Sim.prototype.shockRadius = function () {
    // Chain Reactor widens every wave as the chain climbs.
    var growth = 1 + this.mods.chainRadius * this.chain;
    return Math.min(C.shockRadius(this.level('shock')) * this.mods.shockRadius * growth, 2.4);
  };
  Sim.prototype.popValue = function () {
    return this.upgradeDef('value').value(this.level('value')) * this.mods.popValue;
  };

  /** Odds a new kernel is golden. Spawn levels keep buying these after the
   *  raw spawn rate has hit its ceiling, so the upgrade never goes dead. */
  Sim.prototype.goldenChance = function () {
    var base = Math.min(C.GOLDEN_CHANCE + this.level('spawn') * C.GOLDEN_PER_SPAWN_LEVEL,
                        C.GOLDEN_MAX_CHANCE);
    return Math.min(base * this.mods.golden, 0.5);
  };

  /** Money earned per pop at the current chain length (sub-linear in the chain). */
  Sim.prototype.valueAtChain = function (chain) {
    return this.popValue() * (1 + C.CHAIN_BONUS * Math.sqrt(Math.min(chain, C.CHAIN_BONUS_CAP)));
  };

  Sim.prototype.moneyPerSecond = function () {
    var total = 0;
    for (var i = 0; i < this._earnings.length; i++) total += this._earnings[i].amount;
    return total / C.RATE_WINDOW;
  };

  /* ---------------- kernels ---------------- */

  Sim.prototype.spawnKernel = function () {
    if (this.kernels.length >= C.MAX_KERNELS) return null;

    // A few placement attempts, keeping some breathing room between kernels.
    var best = null, bestDist = -1;
    for (var attempt = 0; attempt < 8; attempt++) {
      var a = Math.random() * Math.PI * 2;
      // sqrt keeps the distribution even across the disc instead of centre-heavy
      var r = Math.sqrt(Math.random()) * C.SPAWN_RADIUS;
      var x = Math.cos(a) * r, y = Math.sin(a) * r;
      var d = this._nearestDistance(x, y);
      if (d > bestDist) { bestDist = d; best = { x: x, y: y }; }
      if (d > C.KERNEL_RADIUS * 3) break;
    }

    var k = {
      id: nextId++,
      x: best.x,
      y: best.y,
      golden: Math.random() < this.goldenChance(),
      heat: this.mods.startHeat,
      rate: this.heatRate() * rand(1 - C.HEAT_JITTER, 1 + C.HEAT_JITTER),
      angle: rand(0, Math.PI * 2),
      seed: Math.random() * 1000,
      age: 0
    };
    this.kernels.push(k);
    this.events.push({ type: 'spawn', x: k.x, y: k.y, golden: k.golden });
    return k;
  };

  Sim.prototype._nearestDistance = function (x, y) {
    var min = Infinity;
    for (var i = 0; i < this.kernels.length; i++) {
      var k = this.kernels[i];
      var dx = k.x - x, dy = k.y - y;
      var d = Math.sqrt(dx * dx + dy * dy);
      if (d < min) min = d;
    }
    return min;
  };

  /** Kernel nearest to a tap, within TAP_RADIUS. Hottest wins on a tie-ish tap. */
  Sim.prototype.kernelAt = function (x, y) {
    var best = null, bestScore = Infinity;
    for (var i = 0; i < this.kernels.length; i++) {
      var k = this.kernels[i];
      var dx = k.x - x, dy = k.y - y;
      var d = Math.sqrt(dx * dx + dy * dy);
      if (d <= C.TAP_RADIUS && d < bestScore) { bestScore = d; best = k; }
    }
    return best;
  };

  Sim.prototype.tap = function (x, y) {
    var k = this.kernelAt(x, y);
    if (!k) return false;
    this.pop(k, true);
    return true;
  };

  /* ---------------- popping ---------------- */

  Sim.prototype.pop = function (kernel, manual) {
    var idx = this.kernels.indexOf(kernel);
    if (idx === -1) return;
    this.kernels.splice(idx, 1);

    var value = this.valueAtChain(this.chain);
    if (kernel.golden) value *= C.GOLDEN_MULT * this.mods.goldenMult;

    // Double Feature and friends: the pop pays twice and throws a second wave.
    var doubled = this.mods.doublePop > 0 && Math.random() < this.mods.doublePop;
    if (doubled) value *= 2;

    this.money += value;
    this.earned += value;
    this._earned += value;
    this.totalPops++;
    this.runPops++;

    this.chain++;
    this.chainTimer = C.chainWindow(this.chain) * this.mods.chainWindow;
    if (this.mega < C.MEGA_MAX) {
      this.mega = Math.min(C.MEGA_MAX, this.mega + this.mods.megaCharge);
    }
    if (this.chain > this.bestChain) this.bestChain = this.chain;

    this.addShockwave(kernel.x, kernel.y);
    if (doubled) this.addShockwave(kernel.x, kernel.y);

    this.events.push({
      type: 'pop',
      x: kernel.x,
      y: kernel.y,
      chain: this.chain,
      value: value,
      manual: !!manual,
      golden: !!kernel.golden,
      doubled: doubled
    });

    // A chain that hits the cap banks itself immediately — the counter stays
    // meaningful and the player gets a jackpot beat on a loop.
    if (this.chain >= C.CHAIN_MAX) {
      this.endChain(true);
      return;
    }

    // Announce milestones once each, in order.
    while (this.chainTier < C.CHAIN_TIERS.length && this.chain >= C.CHAIN_TIERS[this.chainTier]) {
      this.events.push({
        type: 'tier',
        tier: this.chainTier + 1,
        chain: this.chain,
        word: C.TIER_WORDS[this.chainTier] || C.TIER_WORDS[C.TIER_WORDS.length - 1],
        x: kernel.x,
        y: kernel.y
      });
      this.chainTier++;
    }
  };

  /* ---------------- MEGA POP ---------------- */

  Sim.prototype.megaReady = function () { return this.mega >= C.MEGA_MAX; };

  Sim.prototype.megaProgress = function () { return this.mega / C.MEGA_MAX; };

  /** Spend a full meter on one pan-wide wave that pops everything it reaches. */
  Sim.prototype.fireMega = function () {
    if (!this.megaReady()) return false;
    this.mega = 0;

    if (this.shockwaves.length >= C.MAX_SHOCKWAVES) this.shockwaves.shift();
    this.shockwaves.push({
      x: 0, y: 0, r: 0,
      maxR: C.MEGA_RADIUS,
      heat: C.MEGA_HEAT,
      chain: Math.max(this.chain, 40),
      hit: {}
    });

    // Keep any running chain alive long enough for the wave to reach the rim.
    this.chainTimer = Math.max(this.chainTimer, C.CHAIN_WINDOW);
    this.events.push({ type: 'mega' });
    return true;
  };

  Sim.prototype.addShockwave = function (x, y) {
    if (this.shockwaves.length >= C.MAX_SHOCKWAVES) this.shockwaves.shift();
    this.shockwaves.push({
      x: x,
      y: y,
      r: 0,
      maxR: this.shockRadius(),
      heat: this.shockHeat(),
      chain: this.chain,
      hit: {}          // kernel ids already touched by this ring
    });
  };

  /* ---------------- step ---------------- */

  Sim.prototype.update = function (dt) {
    this.time += dt;

    this._updateChain(dt);
    this._updateSpawning(dt);
    this._updateHeat(dt);
    this._updateShockwaves(dt);
    this._updateEarnings(dt);
  };

  Sim.prototype._updateChain = function (dt) {
    if (this.chain <= 0) return;
    this.chainTimer -= dt;
    if (this.chainTimer <= 0) this.endChain(false);
  };

  /**
   * Close out the running chain and bank its bonus. Every cascade therefore
   * finishes on a payout rather than just petering out, and CHAIN_MAX means a
   * self-sustaining pan banks a jackpot on a loop instead of counting to
   * infinity.
   */
  Sim.prototype.endChain = function (maxed) {
    var count = this.chain;
    var bonus = 0;

    if (count >= C.CHAIN_BONUS_MIN) {
      bonus = this.popValue() * count * C.CHAIN_BONUS_FACTOR * this.mods.chainBonus;
      if (maxed) bonus *= 2.5;
      this.money += bonus;
      this.earned += bonus;
      this._earned += bonus;
    }

    this.chain = 0;
    this.chainTier = 0;
    this.chainTimer = 0;
    this.events.push({ type: 'chainEnd', count: count, bonus: bonus, maxed: !!maxed });
  };

  Sim.prototype._updateSpawning = function (dt) {
    this.spawnAcc += this.spawnRate() * dt;
    // Bounded burst: the accumulator can never queue up unbounded work, even if
    // the tab was frozen or the spawn level is enormous.
    if (this.spawnAcc > C.MAX_SPAWN_PER_STEP) this.spawnAcc = C.MAX_SPAWN_PER_STEP;

    while (this.spawnAcc >= 1) {
      this.spawnAcc -= 1;
      if (!this.spawnKernel()) { this.spawnAcc = 0; break; }   // pan is full
    }
    // The pan is never allowed to sit empty for long — there is always
    // something to tap. This is an anti-stall floor, not a spawn source: it
    // waits out a delay first, otherwise an empty pan would spawn (and, once
    // shockwaves are strong, immediately pop) one kernel every single frame.
    if (this.kernels.length === 0) {
      this.emptyFor += dt;
      if (this.emptyFor >= C.EMPTY_REFILL_DELAY) {
        this.emptyFor = 0;
        this.spawnAcc = 0;
        this.spawnKernel();
      }
    } else {
      this.emptyFor = 0;
    }
  };

  Sim.prototype._updateHeat = function (dt) {
    var popped = null;
    for (var i = 0; i < this.kernels.length; i++) {
      var k = this.kernels[i];
      k.age += dt;
      k.heat += k.rate * dt;
      if (k.heat >= 1) (popped || (popped = [])).push(k);
    }
    if (popped) for (var j = 0; j < popped.length; j++) this.pop(popped[j], false);
  };

  Sim.prototype._updateShockwaves = function (dt) {
    for (var i = this.shockwaves.length - 1; i >= 0; i--) {
      var w = this.shockwaves[i];
      var prev = w.r;
      w.r += C.SHOCK_SPEED * dt;

      // Heat every kernel the ring swept across this step (each one only once).
      var popped = null;
      for (var j = 0; j < this.kernels.length; j++) {
        var k = this.kernels[j];
        if (w.hit[k.id]) continue;
        var dx = k.x - w.x, dy = k.y - w.y;
        var d = Math.sqrt(dx * dx + dy * dy);
        if (d > w.maxR) continue;
        if (d <= w.r + C.SHOCK_BAND && d >= prev - C.SHOCK_BAND) {
          w.hit[k.id] = 1;
          // Closer kernels take more heat than ones out near the edge.
          var falloff = 1 - 0.55 * (d / w.maxR);
          k.heat += w.heat * falloff;
          if (k.heat >= 1) (popped || (popped = [])).push(k);
        }
      }
      if (popped) for (var p = 0; p < popped.length; p++) this.pop(popped[p], false);

      if (w.r >= w.maxR) this.shockwaves.splice(i, 1);
    }
  };

  Sim.prototype._updateEarnings = function (dt) {
    if (this._earned > 0) {
      this._earnings.push({ t: this.time, amount: this._earned });
      this._earned = 0;
    }
    var cutoff = this.time - C.RATE_WINDOW;
    while (this._earnings.length && this._earnings[0].t < cutoff) this._earnings.shift();
  };

  /* ---------------- save / load ---------------- */

  Sim.prototype.toJSON = function () {
    return {
      v: 1,
      money: this.money,
      totalPops: this.totalPops,
      bestChain: this.bestChain,
      mega: this.mega,
      levels: this.levels,
      cards: this.cards,
      earned: this.earned,
      runPops: this.runPops,
      draftsTaken: this.draftsTaken
    };
  };

  Sim.prototype.load = function (data) {
    if (!data || data.v !== 1) return false;
    this.money = Math.max(0, Number(data.money) || 0);
    this.totalPops = Math.max(0, Math.floor(Number(data.totalPops) || 0));
    this.bestChain = Math.max(0, Math.floor(Number(data.bestChain) || 0));
    this.mega = clamp(Math.floor(Number(data.mega) || 0), 0, C.MEGA_MAX);
    this.earned = Math.max(0, Number(data.earned) || 0);
    this.runPops = Math.max(0, Math.floor(Number(data.runPops) || 0));
    this.draftsTaken = Math.max(0, Math.floor(Number(data.draftsTaken) || 0));

    this.cards = [];
    var saved = data.cards;
    if (saved && saved.length) {
      for (var c = 0; c < saved.length; c++) {
        if (NS.cardById(saved[c])) this.cards.push(saved[c]);
      }
    }
    this.recomputeMods();
    for (var i = 0; i < C.UPGRADES.length; i++) {
      var id = C.UPGRADES[i].id;
      var lvl = Math.floor(Number(data.levels && data.levels[id]) || 0);
      this.levels[id] = Math.max(0, lvl);
    }
    return true;
  };

  /**
   * Start a fresh batch: everything a run accumulates goes, the meta layer
   * stays. Head Start levels are granted here, so a veteran's pan opens hotter
   * than a beginner's.
   */
  Sim.prototype.startBatch = function () {
    this.kernels.length = 0;
    this.shockwaves.length = 0;
    this.cards.length = 0;
    this.money = 0;
    this.earned = 0;
    this.runPops = 0;
    this.draftsTaken = 0;
    this.chain = 0;
    this.chainTier = 0;
    this.chainTimer = 0;
    this.mega = 0;
    this.spawnAcc = 0;
    this.emptyFor = 0;
    this._earnings.length = 0;
    this._earned = 0;

    for (var i = 0; i < C.UPGRADES.length; i++) this.levels[C.UPGRADES[i].id] = 0;

    var head = this.meta ? this.meta.headStart() : 0;
    for (var h = 0; h < head; h++) {
      var id = C.UPGRADES[h % C.UPGRADES.length].id;
      this.levels[id] = this.level(id) + 1;
    }

    this.recomputeMods();
    for (var k = 0; k < 3; k++) this.spawnKernel();
  };

  /** Full wipe, including everything a batch would normally keep. */
  Sim.prototype.reset = function () {
    this.events.length = 0;
    this.totalPops = 0;
    this.bestChain = 0;
    this.startBatch();
  };

  NS.Sim = Sim;
})(window.POPCORE);
</script>

<script>
/**
 * POPCORE — effects layer.
 *
 * Owns everything that is *only* visual: popcorn puffs, particles, floating
 * money, screen shake, screen flashes and the extra rings that fire on big
 * chains. It never affects gameplay, and the simulation never reads from it.
 *
 * All coordinates are in pan units, same as the simulation.
 */
(function (NS) {
  'use strict';

  var rand = NS.rand;
  var clamp = NS.clamp;

  // Hard caps keep the frame budget predictable on phones.
  var MAX_POPCORN = 42;
  var MAX_PARTICLES = 250;
  var MAX_FLOATERS = 22;
  var MAX_RINGS = 30;

  function Fx() {
    this.popcorn = [];
    this.particles = [];
    this.floaters = [];
    this.rings = [];      // decorative rings (chain milestones), not sim shockwaves

    this.shake = 0;       // current shake amplitude, pan units
    this.shakeX = 0;
    this.shakeY = 0;
    this.flash = 0;       // white-out overlay strength 0..1
    this.flashHue = 40;
    this.heatGlow = 0;    // ambient pan glow, rises with chain intensity
    this.hitstop = 0;     // seconds of frozen simulation — the "impact" pause
    this.zoom = 0;        // camera punch, added to the render scale
    this.time = 0;
  }

  /* ---------------- spawners ---------------- */

  /** The main "a kernel just popped" burst. */
  Fx.prototype.pop = function (x, y, chain, manual, golden) {
    var intensity = clamp(chain / 40, 0, 1);

    this.addPopcorn(x, y, intensity);
    this.addParticles(x, y, (manual ? 20 : 14) + Math.round(intensity * 10), intensity, golden);
    this.addRing(x, y, 0.34 + intensity * 0.2,
      golden ? 'rgba(255,232,140,0.95)' : 'rgba(255,220,170,0.55)', golden ? 0.02 : 0.01);

    this.shake = Math.min(this.shake + (manual ? 0.016 : 0.011) + intensity * 0.026, 0.16);
    this.zoom = Math.min(this.zoom + 0.004 + intensity * 0.008, 0.05);
    this.heatGlow = Math.min(this.heatGlow + 0.06 + intensity * 0.1, 1);

    if (golden) this.golden(x, y);
  };

  /** Jackpot burst: gold everywhere, a hard freeze frame, a big camera punch. */
  Fx.prototype.golden = function (x, y) {
    this.hitstop = Math.max(this.hitstop, 0.09);
    this.zoom = Math.min(this.zoom + 0.05, 0.1);
    this.shake = Math.min(this.shake + 0.09, 0.2);
    this.flash = Math.min(this.flash + 0.4, 0.8);
    this.flashHue = 48;
    this.heatGlow = 1;

    this.addRing(x, y, 1.6, 'rgba(255,236,150,1)', 0.03);
    this.addRing(x, y, 1.1, 'rgba(255,255,255,0.9)', 0.014);
    this.addParticles(x, y, 60, 1, true);
  };

  /** MEGA POP: the biggest punch in the game. */
  Fx.prototype.mega = function () {
    this.hitstop = Math.max(this.hitstop, 0.14);
    this.zoom = Math.min(this.zoom + 0.09, 0.14);
    this.shake = Math.min(this.shake + 0.2, 0.26);
    this.flash = Math.min(this.flash + 0.6, 0.9);
    this.flashHue = 30;
    this.heatGlow = 1;

    this.addRing(0, 0, 2.0, 'rgba(255,255,255,1)', 0.05);
    this.addRing(0, 0, 1.6, 'rgba(255,170,50,0.9)', 0.08);
    this.addParticles(0, 0, 90, 1, true);
  };

  Fx.prototype.addPopcorn = function (x, y, intensity) {
    if (this.popcorn.length >= MAX_POPCORN) this.popcorn.shift();

    // A puff is a few overlapping blobs — cheap, and reads as "fluffy".
    var blobs = [];
    var count = 4 + (Math.random() * 3 | 0);
    for (var i = 0; i < count; i++) {
      var a = (i / count) * Math.PI * 2 + rand(-0.4, 0.4);
      var d = rand(0.1, 0.5);
      blobs.push({
        dx: Math.cos(a) * d,
        dy: Math.sin(a) * d,
        r: rand(0.45, 0.78)
      });
    }

    this.popcorn.push({
      x: x,
      y: y,
      vx: rand(-0.16, 0.16),
      vy: rand(-0.22, -0.02),
      size: NS.CONFIG.KERNEL_RADIUS * rand(0.95, 1.25),
      rot: rand(0, Math.PI * 2),
      vr: rand(-2.4, 2.4),
      life: 0,
      maxLife: rand(1.5, 2.3),
      warm: intensity,
      blobs: blobs
    });
  };

  Fx.prototype.addParticles = function (x, y, count, intensity, golden) {
    for (var i = 0; i < count; i++) {
      if (this.particles.length >= MAX_PARTICLES) this.particles.shift();
      var a = Math.random() * Math.PI * 2;
      var speed = rand(0.3, 1.35) * (1 + intensity * 0.9);
      this.particles.push({
        x: x,
        y: y,
        vx: Math.cos(a) * speed,
        vy: Math.sin(a) * speed,
        life: 0,
        maxLife: rand(0.4, 0.95),
        size: rand(0.008, 0.024) * (golden ? 1.4 : 1),
        hue: golden ? rand(42, 54) : rand(24, 48),
        light: golden ? rand(70, 92) : rand(55, 80)
      });
    }
  };

  Fx.prototype.addFloater = function (x, y, text, chain) {
    if (this.floaters.length >= MAX_FLOATERS) this.floaters.shift();
    this.floaters.push({
      x: x,
      y: y,
      vy: -0.42,
      life: 0,
      maxLife: 0.95,
      text: text,
      scale: 1 + clamp(chain / 60, 0, 0.9)
    });
  };

  /** Extra flair ring — used for milestones, on top of the sim's shockwave. */
  Fx.prototype.addRing = function (x, y, maxR, color, width) {
    if (this.rings.length >= MAX_RINGS) this.rings.shift();
    this.rings.push({ x: x, y: y, r: 0, maxR: maxR, color: color, width: width || 0.02 });
  };

  /** Chain milestone reached — escalating punch. */
  Fx.prototype.tier = function (tier, x, y) {
    var t = Math.min(tier, 8);

    this.hitstop = Math.max(this.hitstop, 0.03 + t * 0.012);
    this.zoom = Math.min(this.zoom + 0.02 + t * 0.008, 0.12);
    this.shake = Math.min(this.shake + 0.06 + t * 0.03, 0.24);
    this.flash = Math.min(this.flash + 0.18 + t * 0.06, 0.85);
    this.flashHue = Math.max(12, 46 - t * 5);
    this.heatGlow = 1;

    this.addRing(x, y, 1.15 + t * 0.12, 'rgba(255,225,160,0.95)', 0.018 + t * 0.006);
    this.addParticles(x, y, 24 + t * 12, 1, t >= 4);

    // From tier 3 the whole pan throws a second wave behind the local one.
    if (t >= 3) this.addRing(0, 0, 1.5, 'rgba(255,150,40,0.8)', 0.035);
    if (t >= 5) this.addRing(0, 0, 1.9, 'rgba(255,255,255,0.7)', 0.02);
  };

  /** Ambient sparks so an idle pan never feels dead. */
  Fx.prototype.ember = function () {
    if (this.particles.length >= MAX_PARTICLES) return;
    var a = Math.random() * Math.PI * 2;
    var r = Math.sqrt(Math.random()) * 0.9;
    this.particles.push({
      x: Math.cos(a) * r,
      y: Math.sin(a) * r,
      vx: rand(-0.04, 0.04),
      vy: rand(-0.14, -0.04),
      life: 0,
      maxLife: rand(0.9, 1.8),
      size: rand(0.004, 0.009),
      hue: rand(20, 40),
      light: rand(45, 65)
    });
  };

  /* ---------------- step ---------------- */

  Fx.prototype.update = function (dt, chain) {
    this.time += dt;

    var i, p;

    // popcorn: drift out, slow down, fade at the end of life
    for (i = this.popcorn.length - 1; i >= 0; i--) {
      p = this.popcorn[i];
      p.life += dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vx *= 0.94;
      p.vy = p.vy * 0.94 + 0.06 * dt;   // a touch of settle
      p.rot += p.vr * dt;
      p.vr *= 0.97;
      if (p.life >= p.maxLife) this.popcorn.splice(i, 1);
    }

    // particles: ballistic with drag
    for (i = this.particles.length - 1; i >= 0; i--) {
      p = this.particles[i];
      p.life += dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vx *= 0.93;
      p.vy = p.vy * 0.93 + 0.35 * dt;
      if (p.life >= p.maxLife) this.particles.splice(i, 1);
    }

    // floating money
    for (i = this.floaters.length - 1; i >= 0; i--) {
      p = this.floaters[i];
      p.life += dt;
      p.y += p.vy * dt;
      p.vy *= 0.96;
      if (p.life >= p.maxLife) this.floaters.splice(i, 1);
    }

    // decorative rings
    for (i = this.rings.length - 1; i >= 0; i--) {
      p = this.rings[i];
      p.r += 2.2 * dt;
      if (p.r >= p.maxR) this.rings.splice(i, 1);
    }

    // screen shake: exponential decay, re-randomised offset each frame
    this.shake *= Math.pow(0.0006, dt);
    if (this.shake < 0.0008) this.shake = 0;
    this.shakeX = rand(-1, 1) * this.shake;
    this.shakeY = rand(-1, 1) * this.shake;

    this.flash *= Math.pow(0.002, dt);
    if (this.flash < 0.004) this.flash = 0;

    this.zoom *= Math.pow(0.0009, dt);
    if (this.zoom < 0.0004) this.zoom = 0;

    // ambient glow tracks how hot things currently are
    var target = clamp(chain / 60, 0, 1);
    this.heatGlow += (target - this.heatGlow) * Math.min(1, dt * 2.2);

    if (Math.random() < dt * (1.5 + this.heatGlow * 8)) this.ember();
  };

  Fx.prototype.clear = function () {
    this.popcorn.length = 0;
    this.particles.length = 0;
    this.floaters.length = 0;
    this.rings.length = 0;
    this.shake = this.flash = this.heatGlow = 0;
    this.hitstop = this.zoom = 0;
  };
