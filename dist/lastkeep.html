<title>LAST KEEP</title>
<style>
/* LAST KEEP — cold, dark, top-down. Mobile first. */

:root {
  color-scheme: dark;
  --bg: #08090e;
  --panel: rgba(255, 255, 255, 0.035);
  --line: rgba(255, 255, 255, 0.09);
  --text: #eef1f6;
  --dim: rgba(238, 241, 246, 0.45);
  --gold: #ffcf5c;
  --danger: #ff4d6d;
  --good: #8bf5a0;
  --pad: 10px;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
  margin: 0;
  height: 100%;
  overflow: hidden;
  background: var(--bg);
  color: var(--text);
  font-family: ui-rounded, "SF Pro Rounded", "Segoe UI", system-ui, -apple-system, sans-serif;
  font-variant-numeric: tabular-nums;
  user-select: none;
  -webkit-user-select: none;
  touch-action: manipulation;
  overscroll-behavior: none;
}

#app {
  display: flex;
  flex-direction: column;
  height: 100dvh;
  max-width: 560px;
  margin: 0 auto;
  padding: max(6px, env(safe-area-inset-top)) var(--pad) max(6px, env(safe-area-inset-bottom));
  gap: 6px;
}

/* ---------------- HUD ---------------- */

#hud {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  flex: 0 0 auto;
}
.hud-block.right { text-align: right; }

.wave {
  font-size: 20px;
  font-weight: 900;
  letter-spacing: 0.04em;
  line-height: 1;
}
.wave.boss { color: var(--danger); text-shadow: 0 0 18px rgba(255, 77, 109, 0.6); }
.wave-sub { margin-top: 3px; font-size: 10px; letter-spacing: 0.16em; color: var(--dim); }

.gold {
  font-size: 22px;
  font-weight: 900;
  color: var(--gold);
  line-height: 1;
  text-shadow: 0 0 18px rgba(255, 207, 92, 0.3);
  transition: transform 90ms ease-out;
}
.gold::before { content: '⬤ '; font-size: 11px; vertical-align: 2px; opacity: 0.8; }
.gold.bump { transform: scale(1.12); }
.relics { margin-top: 3px; font-size: 10px; letter-spacing: 0.14em; color: var(--dim); }

/* ---------------- castle health ---------------- */

.hp-wrap {
  position: relative;
  flex: 0 0 auto;
  height: 16px;
  border-radius: 8px;
  overflow: hidden;
  background: rgba(255, 255, 255, 0.06);
}
.hp-bar {
  height: 100%;
  width: 100%;
  background: linear-gradient(90deg, #4ad07a, #8bf5a0);
  transition: width 200ms ease-out, background 400ms ease;
}
.hp-bar.hurt { background: linear-gradient(90deg, #d8a13c, #ffcf5c); }
.hp-bar.critical { background: linear-gradient(90deg, #c02b45, #ff4d6d); }
.hp-text {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  font-size: 9px;
  font-weight: 800;
  letter-spacing: 0.16em;
  color: rgba(0, 0, 0, 0.65);
}

/* ---------------- stage ---------------- */

#stage { position: relative; flex: 1 1 auto; min-height: 0; }

#field {
  display: block;
  width: 100%;
  height: 100%;
  border-radius: 12px;
  touch-action: none;
}

.banner {
  position: absolute;
  left: 0; right: 0;
  top: 30%;
  text-align: center;
  pointer-events: none;
  font-size: clamp(26px, 9vw, 40px);
  font-weight: 900;
  letter-spacing: 0.02em;
  color: #fff;
  text-shadow: 0 0 30px rgba(120, 180, 255, 0.7);
  opacity: 0;
}
.banner.go { animation: banner 1.4s cubic-bezier(0.2, 1.2, 0.4, 1) both; }
.banner.boss { color: var(--danger); text-shadow: 0 0 34px rgba(255, 77, 109, 0.9); }

@keyframes banner {
  0%   { opacity: 0; transform: scale(1.7); letter-spacing: 0.3em; }
  18%  { opacity: 1; transform: scale(1); letter-spacing: 0.02em; }
  72%  { opacity: 1; }
  100% { opacity: 0; transform: scale(1.05); }
}

.combo {
  position: absolute;
  left: 0; right: 0;
  bottom: 8%;
  text-align: center;
  pointer-events: none;
  font-size: 26px;
  font-weight: 900;
  color: var(--gold);
  text-shadow: 0 0 20px rgba(255, 200, 60, 0.7);
  opacity: 0;
  transition: opacity 200ms ease;
}
.combo.on { opacity: 1; }
.combo.hot { color: #ff9b3d; font-size: 32px; }

.boss-wrap {
  position: absolute;
  left: 8%; right: 8%;
  top: 8px;
  pointer-events: none;
}
.boss-wrap[hidden] { display: none; }
.boss-name {
  font-size: 9px;
  letter-spacing: 0.3em;
  color: var(--danger);
  text-align: center;
  margin-bottom: 3px;
}
.boss-track {
  height: 8px;
  border-radius: 4px;
  background: rgba(0, 0, 0, 0.6);
  border: 1px solid rgba(255, 77, 109, 0.5);
  overflow: hidden;
}
.boss-bar {
  height: 100%;
  width: 100%;
  background: linear-gradient(90deg, #7a1029, #ff4d6d);
  transition: width 120ms linear;
}

/* ---------------- overcharge ---------------- */

.charge {
  position: relative;
  overflow: hidden;
  flex: 0 0 auto;
  height: 38px;
  border-radius: 10px;
  border: 1px solid var(--line);
  background: rgba(255, 255, 255, 0.03);
  color: var(--dim);
  font: inherit;
  font-weight: 900;
  letter-spacing: 0.18em;
  font-size: 11px;
  cursor: default;
}
.charge-fill {
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 0%;
  background: linear-gradient(90deg, rgba(90, 160, 255, 0.45), rgba(150, 220, 255, 0.7));
  transition: width 120ms linear;
}
.charge-label { position: relative; display: grid; place-items: center; height: 100%; }
.charge.ready {
  cursor: pointer;
  color: #05111c;
  border-color: rgba(150, 220, 255, 0.9);
  animation: throb 700ms ease-in-out infinite;
}
.charge.ready .charge-fill { background: linear-gradient(90deg, #4aa8ff, #b6ecff, #4aa8ff); }
.charge.ready:active { transform: scale(0.98); }

@keyframes throb {
  0%, 100% { box-shadow: 0 0 0 rgba(90, 180, 255, 0); }
  50% { box-shadow: 0 0 24px rgba(90, 180, 255, 0.7); }
}

/* ---------------- upgrades ---------------- */

.upgrades {
  flex: 0 0 auto;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 6px;
}

.up {
  position: relative;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  gap: 2px;
  padding: 7px 8px;
  border-radius: 10px;
  border: 1px solid var(--line);
  background: var(--panel);
  color: var(--text);
  font: inherit;
  text-align: left;
  cursor: pointer;
  transition: transform 80ms ease, border-color 150ms ease;
}
.up:disabled { opacity: 0.5; cursor: default; }
.up:not(:disabled) { border-color: rgba(255, 207, 92, 0.5); }
.up:not(:disabled):active { transform: scale(0.96); }
.up.flash { animation: up-flash 400ms ease-out; }

@keyframes up-flash {
  0% { background: rgba(255, 207, 92, 0.45); }
  100% { background: var(--panel); }
}

.up-name { font-size: 10px; font-weight: 800; letter-spacing: 0.04em; white-space: nowrap; }
.up-lvl { font-size: 9px; color: var(--dim); }
.up-cost { font-size: 12px; font-weight: 900; color: var(--dim); }
.up:not(:disabled) .up-cost { color: var(--gold); }
.up-dot {
  position: absolute;
  top: 7px; right: 7px;
  width: 6px; height: 6px;
  border-radius: 50%;
}
.up-bar {
  position: absolute;
  left: 0; bottom: 0;
  height: 2px;
  background: var(--gold);
  opacity: 0.7;
}

/* ---------------- footer ---------------- */

#footer {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 6px;
}

.text-btn {
  flex: 1 1 auto;
  padding: 7px 6px;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: transparent;
  color: var(--dim);
  font: inherit;
  font-size: 9px;
  letter-spacing: 0.12em;
  cursor: pointer;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.text-btn:active { transform: scale(0.96); }
.text-btn.hot { color: var(--gold); border-color: rgba(255, 207, 92, 0.6); }
.text-btn:focus-visible, .up:focus-visible, .charge:focus-visible {
  outline: 2px solid var(--gold);
  outline-offset: 2px;
}

/* ---------------- overlays ---------------- */

.overlay[hidden] { display: none; }

.overlay {
  position: fixed;
  inset: 0;
  z-index: 20;
  display: grid;
  place-items: center;
  padding: 16px;
  background: rgba(5, 6, 10, 0.94);
  animation: fade 180ms ease-out;
}

@keyframes fade { from { opacity: 0; } to { opacity: 1; } }

.overlay-inner {
  width: 100%;
  max-width: 440px;
  max-height: 100%;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.overlay-eyebrow {
  text-align: center;
  font-size: 10px;
  letter-spacing: 0.28em;
  color: var(--dim);
}
.overlay-title {
  margin: 0;
  text-align: center;
  font-size: clamp(26px, 9vw, 36px);
  font-weight: 900;
  color: #fff;
}

.summary {
  display: flex;
  flex-direction: column;
  gap: 6px;
  padding: 14px;
  border-radius: 12px;
  background: rgba(255, 255, 255, 0.05);
  font-size: 13px;
}
.summary .row { display: flex; justify-content: space-between; gap: 10px; }
.summary .row span:last-child { font-weight: 800; }
.summary .big {
  text-align: center;
  font-size: 30px;
  font-weight: 900;
  color: var(--gold);
  padding: 4px 0;
}

.shop-relics { text-align: center; font-size: 20px; font-weight: 900; color: var(--gold); }
.shop-next { margin-top: 3px; font-size: 10px; font-weight: 500; color: var(--dim); }
.shop-list { display: flex; flex-direction: column; gap: 6px; }

.shop-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 10px 12px;
  border-radius: 10px;
  border: 1px solid var(--line);
  background: var(--panel);
  color: var(--text);
  font: inherit;
  text-align: left;
  cursor: pointer;
}
.shop-row:disabled { opacity: 0.45; cursor: default; }
.shop-row:not(:disabled) { border-color: rgba(255, 207, 92, 0.45); }
.shop-row .sn { font-size: 13px; font-weight: 800; }
.shop-row .sd { font-size: 11px; color: var(--dim); }
.shop-row .sv { font-size: 11px; color: rgba(255, 207, 92, 0.85); }
.shop-row .sc { font-size: 14px; font-weight: 900; color: var(--gold); white-space: nowrap; }

.primary-btn {
  padding: 14px;
  border: none;
  border-radius: 12px;
  background: linear-gradient(90deg, #c02b45, #ff7a5c);
  color: #fff;
  font: inherit;
  font-size: 13px;
  font-weight: 900;
  letter-spacing: 0.14em;
  cursor: pointer;
}
.primary-btn:active { transform: scale(0.98); }

.close-btn {
  padding: 11px;
  border-radius: 10px;
  border: 1px solid var(--line);
  background: transparent;
  color: var(--dim);
  font: inherit;
  font-size: 11px;
  letter-spacing: 0.14em;
  cursor: pointer;
}

@media (prefers-reduced-motion: reduce) {
  .charge.ready, .banner.go { animation: none; }
  .banner.go { opacity: 1; }
}
</style>

<div id="app">

  <header id="hud">
    <div class="hud-block">
      <div id="wave" class="wave">WAVE 1</div>
      <div id="waveSub" class="wave-sub">incoming</div>
    </div>
    <div class="hud-block right">
      <div id="gold" class="gold">0</div>
      <div id="relics" class="relics">◈ 0</div>
    </div>
  </header>

  <div id="hpWrap" class="hp-wrap">
    <div id="hpBar" class="hp-bar"></div>
    <span id="hpText" class="hp-text">100 / 100</span>
  </div>

  <main id="stage">
    <canvas id="field"></canvas>
    <div id="banner" class="banner"></div>
    <div id="combo" class="combo"></div>
    <div id="bossWrap" class="boss-wrap" hidden>
      <div class="boss-name">BOSS</div>
      <div class="boss-track"><div id="bossBar" class="boss-bar"></div></div>
    </div>
  </main>

  <button id="charge" class="charge" type="button" disabled>
    <span id="chargeFill" class="charge-fill"></span>
    <span id="chargeLabel" class="charge-label">OVERCHARGE</span>
  </button>

  <section id="upgrades" class="upgrades"></section>

  <footer id="footer">
    <button id="callWave" class="text-btn" type="button">call next wave +30%</button>
    <button id="shopBtn" class="text-btn" type="button">◈ relics</button>
    <button id="mute" class="text-btn" type="button">sound on</button>
  </footer>

  <div id="over" class="overlay" hidden>
    <div class="overlay-inner">
      <div class="overlay-eyebrow">THE WALL IS BREACHED</div>
      <h2 class="overlay-title">RUN OVER</h2>
      <div id="overSummary" class="summary"></div>
      <button id="again" class="primary-btn" type="button">SPEND RELICS &amp; REBUILD</button>
    </div>
  </div>

  <div id="shop" class="overlay" hidden>
    <div class="overlay-inner">
      <div class="overlay-eyebrow">CARRIED BETWEEN RUNS</div>
      <h2 class="overlay-title">RELIC HALL</h2>
      <div id="shopRelics" class="shop-relics">◈ 0</div>
      <div id="shopList" class="shop-list"></div>
      <button id="shopClose" class="close-btn" type="button">BACK TO THE WALL</button>
    </div>
  </div>

</div>

<script>
/**
 * LAST KEEP — balance, enemy types, tower types, wave composition.
 *
 * All of it is data. The simulation reads these tables and never hard-codes a
 * unit, so a new enemy or tower is an entry here plus (at most) a shape in the
 * renderer.
 *
 * The field is normalised: x and y both run 0..1, enemies enter at the top
 * (y < 0) and walk down. The castle wall sits at CASTLE_Y. The renderer maps
 * that square to whatever the screen gives it, so balance is resolution-free.
 */
window.SIEGE = window.SIEGE || {};

SIEGE.CONFIG = {
  /* ---- field ---- */
  SPAWN_Y: -0.06,
  CASTLE_Y: 0.93,
  MAX_ENEMIES: 90,
  MAX_PROJECTILES: 160,

  /* ---- castle ---- */
  CASTLE_HP: 100,

  /* ---- tapping ----
   * Tapping is not a garnish: the combo multiplier and the overcharge meter
   * are what make a boss survivable, so an engaged player clears waves a
   * passive one cannot.
   */
  TAP_RADIUS: 0.08,
  COMBO_WINDOW: 1.1,        // seconds before a tap streak lapses
  COMBO_STEP: 0.14,         // damage multiplier gained per streak hit
  COMBO_MAX: 24,
  BOSS_TAP_BONUS: 3,        // taps hit bosses this much harder

  OVERCHARGE_MAX: 55,       // taps to fill the meter
  OVERCHARGE_DAMAGE: 35,    // × tap damage, dealt to everything on the field

  /* ---- waves ---- */
  WAVE_BREAK: 4,            // seconds between waves
  EARLY_CALL_BONUS: 0.3,    // bonus gold for calling the next wave early
  BOSS_EVERY: 10,
  WAVE_CLEAR_GOLD: 8,       // base bounty for clearing a wave

  /* The squeeze that ends every run.
   *
   * What decides a wave is not its total health but whether one enemy can be
   * killed during its walk to the wall. So the numbers are set against DPS,
   * not against wave size:
   *
   *   player DPS grows  ≈ (gold income growth) ^ (ln 1.27 / ln 1.5) ≈ g^0.59
   *   income growth     = BUDGET_GROWTH * GOLD_GROWTH ≈ 1.21  → DPS ≈ 1.12/wave
   *   enemy health      = HP_GROWTH                            = 1.16/wave
   *
   * That leaves enemies gaining ~3.6% on the player every wave. A first run
   * opens with roughly double the damage it needs, so the gap closes around
   * wave 20-25 — and every relic spent widens it again.
   *
   * Waves stay short by growing in strength rather than in headcount. */
  HP_GROWTH: 1.16,
  SPEED_GROWTH: 1.008,
  GOLD_GROWTH: 1.13,
  BUDGET_GROWTH: 1.07,
  BUDGET_BASE: 5,

  /* ---- misc ---- */
  MAX_DT: 0.05,
  SAVE_INTERVAL: 5
};

/* ---------------- enemies ---------------- */

SIEGE.ENEMIES = {
  grunt: {
    name: 'Grunt', hp: 12, speed: 0.07, gold: 3, damage: 5, armor: 0,
    size: 0.021, color: '#7ec8ff', cost: 1, from: 1
  },
  runner: {
    name: 'Runner', hp: 7, speed: 0.14, gold: 3, damage: 4, armor: 0,
    size: 0.017, color: '#8bf5a0', cost: 1.1, from: 3
  },
  swarm: {
    name: 'Swarm', hp: 4, speed: 0.1, gold: 1, damage: 2, armor: 0,
    size: 0.012, color: '#ffe08a', cost: 0.4, from: 5, group: 5
  },
  tank: {
    name: 'Tank', hp: 58, speed: 0.045, gold: 11, damage: 15, armor: 3,
    size: 0.033, color: '#ff9b6b', cost: 3.2, from: 7
  },
  phantom: {
    // Untouchable by towers half the time: the enemy that forces the player to
    // put a finger on the screen.
    name: 'Phantom', hp: 24, speed: 0.08, gold: 10, damage: 9, armor: 0,
    size: 0.024, color: '#c9a0ff', cost: 2.8, from: 12,
    phase: true, phaseOn: 2.2, phaseOff: 1.6
  },
  brute: {
    name: 'Brute', hp: 130, speed: 0.04, gold: 22, damage: 25, armor: 6,
    size: 0.042, color: '#ff7070', cost: 6, from: 18
  },
  boss: {
    name: 'BOSS', hp: 520, speed: 0.035, gold: 90, damage: 45, armor: 5,
    size: 0.058, color: '#ff4d6d', boss: true
  }
};

/* ---------------- towers ---------------- */

/* Four emplacements, always present, upgraded with gold. No placement puzzle:
 * the taps belong to the fighting. */
SIEGE.TOWERS = [
  {
    id: 'cannon', name: 'Cannon', kind: 'single',
    x: 0.5, y: 0.78, color: '#ffb347',
    desc: 'Single target, steady damage',
    baseCost: 20, costMult: 1.5,
    damage: function (l) { return 7 * Math.pow(1.27, l); },
    rate: function (l) { return Math.min(1.1 + l * 0.035, 3.2); },
    range: function (l) { return Math.min(0.38 + l * 0.006, 0.62); }
  },
  {
    id: 'frost', name: 'Frost', kind: 'slow',
    x: 0.15, y: 0.68, color: '#7fdfff',
    desc: 'Chills everything it hits',
    baseCost: 30, costMult: 1.52,
    damage: function (l) { return 3 * Math.pow(1.22, l); },
    rate: function (l) { return Math.min(0.8 + l * 0.03, 2.4); },
    range: function (l) { return Math.min(0.34 + l * 0.007, 0.6); },
    slow: function (l) { return Math.min(0.35 + l * 0.015, 0.75); },
    slowTime: 1.6
  },
  {
    id: 'mortar', name: 'Mortar', kind: 'splash',
    x: 0.85, y: 0.68, color: '#ff8f6b',
    desc: 'Slow shells, wide blast',
    baseCost: 45, costMult: 1.55,
    damage: function (l) { return 14 * Math.pow(1.29, l); },
    rate: function (l) { return Math.min(0.42 + l * 0.012, 1.3); },
    range: function (l) { return Math.min(0.55 + l * 0.006, 0.85); },
    splash: function (l) { return 0.09 + l * 0.002; }
  },
  {
    id: 'tesla', name: 'Tesla', kind: 'chain',
    x: 0.5, y: 0.56, color: '#c9a0ff',
    desc: 'Arcs between nearby enemies',
    baseCost: 60, costMult: 1.56,
    damage: function (l) { return 5 * Math.pow(1.25, l); },
    rate: function (l) { return Math.min(1.4 + l * 0.04, 3.6); },
    range: function (l) { return Math.min(0.3 + l * 0.006, 0.55); },
    chains: function (l) { return 2 + Math.floor(l / 4); },
    chainRange: 0.16
  }
];

/* The player's own attack is upgraded like a tower. */
SIEGE.TAP_UPGRADE = {
  id: 'tap', name: 'Your Hand',
  desc: 'Damage per tap',
  baseCost: 15, costMult: 1.48,
  damage: function (l) { return 5 * Math.pow(1.32, l); }
};

/* ---------------- waves ---------------- */

SIEGE.wave = {
  /** Points available to spend on enemies in this wave. */
  budget: function (n) {
    var C = SIEGE.CONFIG;
    return C.BUDGET_BASE * Math.pow(C.BUDGET_GROWTH, n - 1);
  },

  isBoss: function (n) { return n % SIEGE.CONFIG.BOSS_EVERY === 0; },

  /** Multipliers applied to every enemy in wave n. */
  scale: function (n) {
    var C = SIEGE.CONFIG;
    return {
      hp: Math.pow(C.HP_GROWTH, n - 1),
      speed: Math.pow(C.SPEED_GROWTH, n - 1),
      gold: Math.pow(C.GOLD_GROWTH, n - 1)
    };
  },

  /**
   * Build the spawn list for a wave: a series of {type, at} entries, where
   * `at` is seconds after the wave starts.
   */
  build: function (n) {
    var C = SIEGE.CONFIG;
    var spawns = [];
    var boss = SIEGE.wave.isBoss(n);
    var budget = SIEGE.wave.budget(n) * (boss ? 0.55 : 1);

    var available = [];
    for (var id in SIEGE.ENEMIES) {
      if (!SIEGE.ENEMIES.hasOwnProperty(id)) continue;
      var def = SIEGE.ENEMIES[id];
      if (def.boss || n < def.from) continue;
      available.push(id);
    }

    // Later waves come in tighter, so the field fills up rather than trickling.
    var interval = Math.max(0.25, 0.8 - n * 0.01);
    var t = 0;
    var guard = 0;

    while (budget > 0 && guard++ < 400) {
      var id = available[Math.floor(Math.random() * available.length)];
      var e = SIEGE.ENEMIES[id];
      if (e.cost > budget && guard > 3) break;

      var count = e.group || 1;
      for (var i = 0; i < count; i++) {
        spawns.push({ type: id, at: t + i * 0.12 });
      }
      budget -= e.cost;
      t += interval * (e.group ? 1.4 : 1);
    }

    if (boss) {
      // The boss walks in after its escort, so the player meets it with a
      // half-clear field and a charged overcharge meter.
      spawns.push({ type: 'boss', at: t + 1.5 });
    }

    spawns.sort(function (a, b) { return a.at - b.at; });
    return spawns;
  }
};

/* ---------------- helpers ---------------- */

SIEGE.clamp = function (v, lo, hi) { return v < lo ? lo : v > hi ? hi : v; };
SIEGE.rand = function (a, b) { return a + Math.random() * (b - a); };
SIEGE.lerp = function (a, b, t) { return a + (b - a) * t; };

SIEGE.SUFFIX = ['', 'K', 'M', 'B', 'T', 'Qa', 'Qi', 'Sx', 'Sp'];

SIEGE.fmt = function (n) {
  if (!isFinite(n)) return '∞';
  if (n < 1000) return n < 10 ? (Math.round(n * 10) / 10).toString() : Math.floor(n).toString();
  var tier = Math.floor(Math.log10(n) / 3);
  var suffix = SIEGE.SUFFIX[tier];
  if (!suffix) return n.toExponential(2);
  var scaled = n / Math.pow(1000, tier);
  return (scaled < 10 ? scaled.toFixed(2) : scaled < 100 ? scaled.toFixed(1) : scaled.toFixed(0)) + suffix;
};
</script>

<script>
/**
 * LAST KEEP — what survives a lost run.
 *
 * The keep always falls eventually: enemy strength climbs faster than gold
 * does, by design. Falling pays RELICS, scaled to the deepest wave reached,
 * and relics buy permanent upgrades that make the next attempt reach further.
 *
 * Relics are sub-linear in the wave reached, so grinding a shallow run twenty
 * times never beats pushing one run deeper.
 */
(function (NS) {
  'use strict';

  NS.META = {
    RELIC_SCALE: 1.6,
    RELIC_EXPONENT: 0.85,

    UPGRADES: [
      {
        id: 'walls', name: 'Thicker Walls', desc: 'More castle health',
        baseCost: 8, costMult: 1.5, max: 40,
        format: function (l) { return '+' + (l * 25) + ' HP'; }
      },
      {
        id: 'purse', name: 'War Chest', desc: 'Start every run with more gold',
        baseCost: 6, costMult: 1.45, max: 40,
        format: function (l) { return '+' + (l * 30) + ' gold'; }
      },
      {
        id: 'hand', name: 'Strong Hand', desc: 'Your taps hit harder, always',
        baseCost: 10, costMult: 1.55, max: 40,
        format: function (l) { return '×' + Math.pow(1.3, l).toFixed(2) + ' tap damage'; }
      },
      {
        id: 'forge', name: 'Forge', desc: 'All towers hit harder',
        baseCost: 12, costMult: 1.6, max: 40,
        format: function (l) { return '×' + Math.pow(1.25, l).toFixed(2) + ' tower damage'; }
      },
      {
        id: 'greed', name: 'Spoils', desc: 'Enemies drop more gold',
        baseCost: 9, costMult: 1.5, max: 30,
        format: function (l) { return '+' + (l * 15) + '% gold'; }
      },
      {
        id: 'quartermaster', name: 'Quartermaster', desc: 'Upgrades cost less',
        baseCost: 14, costMult: 1.7, max: 12,
        format: function (l) { return '−' + Math.round((1 - Math.pow(0.94, l)) * 100) + '% cost'; }
      },
      {
        id: 'capacitor', name: 'Capacitor', desc: 'Overcharge fills faster',
        baseCost: 11, costMult: 1.6, max: 15,
        format: function (l) { return '×' + (1 + l * 0.2).toFixed(1) + ' charge rate'; }
      }
    ]
  };

  function Meta() {
    this.relics = 0;
    this.lifetime = 0;
    this.runs = 0;
    this.bestWave = 0;
    this.levels = {};
    for (var i = 0; i < NS.META.UPGRADES.length; i++) this.levels[NS.META.UPGRADES[i].id] = 0;
  }

  Meta.prototype.def = function (id) {
    for (var i = 0; i < NS.META.UPGRADES.length; i++) {
      if (NS.META.UPGRADES[i].id === id) return NS.META.UPGRADES[i];
    }
    return null;
  };

  Meta.prototype.level = function (id) { return this.levels[id] || 0; };
  Meta.prototype.maxed = function (id) { return this.level(id) >= this.def(id).max; };

  Meta.prototype.cost = function (id) {
    var def = this.def(id);
    return Math.ceil(def.baseCost * Math.pow(def.costMult, this.level(id)));
  };

  Meta.prototype.canBuy = function (id) {
    return !this.maxed(id) && this.relics >= this.cost(id);
  };

  Meta.prototype.buy = function (id) {
    if (!this.canBuy(id)) return false;
    this.relics -= this.cost(id);
    this.levels[id] = this.level(id) + 1;
    return true;
  };

  /* ---- what the meta layer grants a run ---- */

  Meta.prototype.bonusHp = function () { return this.level('walls') * 25; };
  Meta.prototype.startGold = function () { return this.level('purse') * 30; };
  Meta.prototype.tapMult = function () { return Math.pow(1.3, this.level('hand')); };
  Meta.prototype.towerMult = function () { return Math.pow(1.25, this.level('forge')); };
  Meta.prototype.goldMult = function () { return 1 + this.level('greed') * 0.15; };
  Meta.prototype.costMult = function () { return Math.pow(0.94, this.level('quartermaster')); };
  Meta.prototype.chargeRate = function () { return 1 + this.level('capacitor') * 0.2; };

  /** Relics a run that died on this wave is worth. */
  Meta.prototype.relicsFor = function (wave) {
    if (wave < 1) return 0;
    return Math.floor(NS.META.RELIC_SCALE * Math.pow(wave, NS.META.RELIC_EXPONENT));
  };

  Meta.prototype.bank = function (wave) {
    var gain = this.relicsFor(wave);
    this.relics += gain;
    this.lifetime += gain;
    this.runs++;
    if (wave > this.bestWave) this.bestWave = wave;
    return gain;
  };

  Meta.prototype.toJSON = function () {
    return {
      relics: this.relics, lifetime: this.lifetime,
      runs: this.runs, bestWave: this.bestWave, levels: this.levels
    };
  };

  Meta.prototype.load = function (data) {
    if (!data) return;
    this.relics = Math.max(0, Math.floor(Number(data.relics) || 0));
    this.lifetime = Math.max(0, Math.floor(Number(data.lifetime) || 0));
    this.runs = Math.max(0, Math.floor(Number(data.runs) || 0));
    this.bestWave = Math.max(0, Math.floor(Number(data.bestWave) || 0));
    for (var i = 0; i < NS.META.UPGRADES.length; i++) {
      var def = NS.META.UPGRADES[i];
      var lvl = Math.floor(Number(data.levels && data.levels[def.id]) || 0);
      this.levels[def.id] = NS.clamp(lvl, 0, def.max);
    }
  };

  Meta.prototype.wipe = function () {
    this.relics = this.lifetime = this.runs = this.bestWave = 0;
    for (var i = 0; i < NS.META.UPGRADES.length; i++) this.levels[NS.META.UPGRADES[i].id] = 0;
  };

  NS.Meta = Meta;
})(window.SIEGE);
</script>

<script>
/**
 * LAST KEEP — simulation.
 *
 * Owns the fight: enemies marching down the field, towers shooting, taps,
 * gold, waves, castle health. Knows nothing about canvas, DOM or audio; it
 * reports what happened through `events`, drained once per frame.
 *
 * Event shapes:
 *   { type:'shot',   x, y, tx, ty, tower }
 *   { type:'hit',    x, y, damage, killed, boss }
 *   { type:'kill',   x, y, gold, boss, enemy }
 *   { type:'tap',    x, y, damage, hit, combo }
 *   { type:'leak',   x, y, damage }          // enemy reached the castle
 *   { type:'wave',   n, boss }
 *   { type:'cleared',n, bonus }
 *   { type:'over',   wave }
 *   { type:'overcharge' }
 */
(function (NS) {
  'use strict';

  var C = NS.CONFIG;
  var clamp = NS.clamp;
  var rand = NS.rand;

  var nextId = 1;

  function Sim(meta) {
    this.meta = meta || null;
    this.events = [];

    this.enemies = [];
    this.projectiles = [];

    this.levels = { tap: 0 };
    for (var i = 0; i < NS.TOWERS.length; i++) this.levels[NS.TOWERS[i].id] = 0;

    this.towers = NS.TOWERS.map(function (def) {
      return { def: def, cooldown: 0, angle: 0, target: null, flash: 0 };
    });

    this.reset();
  }

  Sim.prototype.reset = function () {
    var m = this.meta;

    this.enemies.length = 0;
    this.projectiles.length = 0;
    this.events.length = 0;

    this.maxHp = C.CASTLE_HP + (m ? m.bonusHp() : 0);
    this.hp = this.maxHp;
    this.gold = 40 + (m ? m.startGold() : 0);
    this.wave = 0;
    this.spawnQueue = [];
    this.waveTime = 0;
    this.breakTime = C.WAVE_BREAK;
    this.inWave = false;
    this.over = false;
    this.time = 0;

    this.combo = 0;
    this.comboTimer = 0;
    this.overcharge = 0;
    this.taps = 0;
    this.kills = 0;
    this.earned = 0;

    this.levels.tap = 0;
    for (var i = 0; i < NS.TOWERS.length; i++) this.levels[NS.TOWERS[i].id] = 0;
    for (var t = 0; t < this.towers.length; t++) {
      this.towers[t].cooldown = 0;
      this.towers[t].target = null;
    }
  };

  /* ---------------- upgrades ---------------- */

  Sim.prototype.level = function (id) { return this.levels[id] || 0; };

  Sim.prototype.upgradeDef = function (id) {
    if (id === 'tap') return NS.TAP_UPGRADE;
    for (var i = 0; i < NS.TOWERS.length; i++) {
      if (NS.TOWERS[i].id === id) return NS.TOWERS[i];
    }
    return null;
  };

  Sim.prototype.cost = function (id) {
    var def = this.upgradeDef(id);
    var discount = this.meta ? this.meta.costMult() : 1;
    return def.baseCost * Math.pow(def.costMult, this.level(id)) * discount;
  };

  Sim.prototype.canBuy = function (id) { return !this.over && this.gold >= this.cost(id); };

  Sim.prototype.buy = function (id) {
    if (!this.canBuy(id)) return false;
    this.gold -= this.cost(id);
    this.levels[id] = this.level(id) + 1;
    return true;
  };

  Sim.prototype.towerDamage = function (def) {
    var mult = this.meta ? this.meta.towerMult() : 1;
    return def.damage(this.level(def.id)) * mult;
  };

  Sim.prototype.tapDamage = function () {
    var base = NS.TAP_UPGRADE.damage(this.level('tap'));
    var mult = this.meta ? this.meta.tapMult() : 1;
    return base * mult * this.comboMult();
  };

  Sim.prototype.comboMult = function () {
    return 1 + Math.min(this.combo, C.COMBO_MAX) * C.COMBO_STEP;
  };

  Sim.prototype.overchargeMax = function () {
    return C.OVERCHARGE_MAX;
  };

  Sim.prototype.overchargeReady = function () { return this.overcharge >= this.overchargeMax(); };

  /* ---------------- waves ---------------- */

  Sim.prototype.startWave = function (early) {
    this.wave++;
    this.spawnQueue = NS.wave.build(this.wave);
    this.waveTime = 0;
    this.inWave = true;
    this.earlyCall = !!early;
    this.events.push({ type: 'wave', n: this.wave, boss: NS.wave.isBoss(this.wave) });
  };

  /** Call the next wave during a break, for bonus gold. */
  Sim.prototype.callEarly = function () {
    if (this.inWave || this.over) return false;
    this.breakTime = 0;
    this.startWave(true);
    return true;
  };

  Sim.prototype.spawn = function (typeId) {
    if (this.enemies.length >= C.MAX_ENEMIES) return null;

    var def = NS.ENEMIES[typeId];
    var scale = NS.wave.scale(this.wave);
    var hp = def.hp * scale.hp * (def.boss ? 1 + this.wave * 0.06 : 1);

    var e = {
      id: nextId++,
      type: typeId,
      def: def,
      x: rand(0.1, 0.9),
      y: C.SPAWN_Y - rand(0, 0.05),
      hp: hp,
      maxHp: hp,
      speed: def.speed * scale.speed,
      gold: def.gold * scale.gold,
      armor: def.armor,
      slow: 0,
      slowTimer: 0,
      wobble: rand(0, Math.PI * 2),
      phased: false,
      phaseTimer: def.phase ? rand(0, def.phaseOn) : 0,
      hitFlash: 0,
      boss: !!def.boss
    };
    if (e.boss) e.x = 0.5;
    this.enemies.push(e);
    return e;
  };

  /* ---------------- damage ---------------- */

  /**
   * Apply damage to one enemy. `fromTap` bypasses phasing and gets the boss
   * bonus, which is what makes a player's finger matter on a boss.
   */
  Sim.prototype.damage = function (e, amount, fromTap) {
    if (e.dead) return 0;
    if (!fromTap && e.phased) return 0;

    var dealt = Math.max(amount - (fromTap ? 0 : e.armor), amount * 0.15);
    if (fromTap && e.boss) dealt *= C.BOSS_TAP_BONUS;

    e.hp -= dealt;
    e.hitFlash = 1;

    var killed = e.hp <= 0;
    if (killed) this.kill(e);

    this.events.push({
      type: 'hit', x: e.x, y: e.y, damage: dealt, killed: killed, boss: e.boss
    });
    return dealt;
  };

  Sim.prototype.kill = function (e) {
    if (e.dead) return;
    e.dead = true;

    var mult = this.meta ? this.meta.goldMult() : 1;
    var gold = e.gold * mult;
    this.gold += gold;
    this.earned += gold;
    this.kills++;

    this.events.push({ type: 'kill', x: e.x, y: e.y, gold: gold, boss: e.boss, enemy: e.def.name });
  };

  /* ---------------- player input ---------------- */

  /** Tap the field. Hits the closest enemy within TAP_RADIUS. */
  Sim.prototype.tap = function (x, y) {
    if (this.over) return false;

    var best = null, bestDist = C.TAP_RADIUS;
    for (var i = 0; i < this.enemies.length; i++) {
      var e = this.enemies[i];
      if (e.dead) continue;
      var dx = e.x - x, dy = e.y - y;
      var d = Math.sqrt(dx * dx + dy * dy);
      // Bigger enemies are easier to hit — their body counts, not just centre.
      if (d - e.def.size < bestDist) { bestDist = d - e.def.size; best = e; }
    }

    this.taps++;
    if (this.overcharge < this.overchargeMax()) {
      this.overcharge = Math.min(this.overchargeMax(),
        this.overcharge + (this.meta ? this.meta.chargeRate() : 1));
    }

    if (!best) {
      this.events.push({ type: 'tap', x: x, y: y, damage: 0, hit: false, combo: this.combo });
      return false;
    }

    this.combo++;
    this.comboTimer = C.COMBO_WINDOW;

    var dmg = this.tapDamage();
    this.damage(best, dmg, true);
    this.events.push({ type: 'tap', x: best.x, y: best.y, damage: dmg, hit: true, combo: this.combo });
    return true;
  };

  /** Spend a full meter: heavy damage to everything on the field. */
  Sim.prototype.fireOvercharge = function () {
    if (!this.overchargeReady() || this.over) return false;
    this.overcharge = 0;

    var dmg = NS.TAP_UPGRADE.damage(this.level('tap')) *
              (this.meta ? this.meta.tapMult() : 1) * C.OVERCHARGE_DAMAGE;

    for (var i = this.enemies.length - 1; i >= 0; i--) {
      var e = this.enemies[i];
      if (!e.dead) this.damage(e, dmg, true);
    }
    this.events.push({ type: 'overcharge' });
    return true;
  };

  /* ---------------- step ---------------- */

  Sim.prototype.update = function (dt) {
    if (this.over) return;

    this.time += dt;

    this._updateCombo(dt);
    this._updateWave(dt);
    this._updateEnemies(dt);
    this._updateTowers(dt);
    this._updateProjectiles(dt);
    this._cull();
  };

  Sim.prototype._updateCombo = function (dt) {
    if (this.combo <= 0) return;
    this.comboTimer -= dt;
    if (this.comboTimer <= 0) this.combo = 0;
  };

  Sim.prototype._updateWave = function (dt) {
    if (!this.inWave) {
      this.breakTime -= dt;
      if (this.breakTime <= 0) this.startWave(false);
      return;
    }

    this.waveTime += dt;
    while (this.spawnQueue.length && this.spawnQueue[0].at <= this.waveTime) {
      this.spawn(this.spawnQueue.shift().type);
    }

    // The wave ends when everything queued has spawned and died.
    if (!this.spawnQueue.length && !this.enemies.length) {
      var bonus = C.WAVE_CLEAR_GOLD * Math.pow(C.GOLD_GROWTH, this.wave - 1) *
                  (this.earlyCall ? 1 + C.EARLY_CALL_BONUS : 1) *
                  (this.meta ? this.meta.goldMult() : 1);
      this.gold += bonus;
      this.earned += bonus;
      this.inWave = false;
      this.breakTime = C.WAVE_BREAK;
      this.events.push({ type: 'cleared', n: this.wave, bonus: bonus });
    }
  };

  Sim.prototype._updateEnemies = function (dt) {
    for (var i = 0; i < this.enemies.length; i++) {
      var e = this.enemies[i];
      if (e.dead) continue;

      if (e.slowTimer > 0) {
        e.slowTimer -= dt;
        if (e.slowTimer <= 0) e.slow = 0;
      }
      if (e.hitFlash > 0) e.hitFlash = Math.max(0, e.hitFlash - dt * 5);

      if (e.def.phase) {
        e.phaseTimer -= dt;
        if (e.phaseTimer <= 0) {
          e.phased = !e.phased;
          e.phaseTimer = e.phased ? e.def.phaseOn : e.def.phaseOff;
        }
      }

      e.y += e.speed * (1 - e.slow) * dt;
      e.wobble += dt * 1.6;
      e.x = clamp(e.x + Math.sin(e.wobble) * 0.012 * dt, 0.04, 0.96);

      if (e.y >= C.CASTLE_Y) {
        this.hp -= e.def.damage;
        e.dead = true;
        this.events.push({ type: 'leak', x: e.x, y: C.CASTLE_Y, damage: e.def.damage });

        if (this.hp <= 0) {
          this.hp = 0;
          this.over = true;
          this.events.push({ type: 'over', wave: this.wave });
          return;
        }
      }
    }
  };

  Sim.prototype._updateTowers = function (dt) {
    for (var i = 0; i < this.towers.length; i++) {
      var t = this.towers[i];
      var def = t.def;
      var level = this.level(def.id);

      if (t.flash > 0) t.flash = Math.max(0, t.flash - dt * 6);
      t.cooldown -= dt;

      var target = this._nearestEnemy(def.x, def.y, def.range(level));
      t.target = target;
      if (!target) continue;

      t.angle = Math.atan2(target.y - def.y, target.x - def.x);
      if (t.cooldown > 0) continue;

      t.cooldown = 1 / def.rate(level);
      t.flash = 1;
      this._fire(t, target, level);
    }
  };

  Sim.prototype._fire = function (t, target, level) {
    var def = t.def;
    var damage = this.towerDamage(def);

    this.events.push({
      type: 'shot', x: def.x, y: def.y, tx: target.x, ty: target.y, tower: def.id
    });

    if (def.kind === 'chain') {
      // Tesla arcs immediately: first target, then outward to its neighbours.
      var hit = [target];
      this.damage(target, damage, false);
      var chains = def.chains(level);
      var from = target;

      for (var c = 0; c < chains; c++) {
        var next = this._nearestEnemy(from.x, from.y, def.chainRange, hit);
        if (!next) break;
        this.damage(next, damage * 0.75, false);
        hit.push(next);
        this.events.push({ type: 'shot', x: from.x, y: from.y, tx: next.x, ty: next.y, tower: def.id });
        from = next;
      }
      return;
    }

    if (this.projectiles.length >= C.MAX_PROJECTILES) this.projectiles.shift();
    this.projectiles.push({
      x: def.x, y: def.y,
      tx: target.x, ty: target.y,
      target: target,
      speed: def.kind === 'splash' ? 0.9 : 1.6,
      damage: damage,
      kind: def.kind,
      splash: def.splash ? def.splash(level) : 0,
      slow: def.slow ? def.slow(level) : 0,
      slowTime: def.slowTime || 0,
      color: def.color
    });
  };

  Sim.prototype._nearestEnemy = function (x, y, range, exclude) {
    var best = null, bestD = range;
    for (var i = 0; i < this.enemies.length; i++) {
      var e = this.enemies[i];
      if (e.dead || e.phased) continue;
      if (exclude && exclude.indexOf(e) !== -1) continue;
      var dx = e.x - x, dy = e.y - y;
      var d = Math.sqrt(dx * dx + dy * dy);
      if (d < bestD) { bestD = d; best = e; }
    }
    return best;
  };

  Sim.prototype._updateProjectiles = function (dt) {
    for (var i = this.projectiles.length - 1; i >= 0; i--) {
      var p = this.projectiles[i];

      // Home in while the target lives, otherwise carry on to its last position.
      if (p.target && !p.target.dead) { p.tx = p.target.x; p.ty = p.target.y; }

      var dx = p.tx - p.x, dy = p.ty - p.y;
      var dist = Math.sqrt(dx * dx + dy * dy);
      var step = p.speed * dt;

      if (dist <= step || dist < 0.006) {
        this._impact(p);
        this.projectiles.splice(i, 1);
        continue;
      }
      p.x += (dx / dist) * step;
      p.y += (dy / dist) * step;
    }
  };

  Sim.prototype._impact = function (p) {
    if (p.kind === 'splash') {
      for (var i = 0; i < this.enemies.length; i++) {
        var e = this.enemies[i];
        if (e.dead || e.phased) continue;
        var dx = e.x - p.tx, dy = e.y - p.ty;
        if (Math.sqrt(dx * dx + dy * dy) <= p.splash) this.damage(e, p.damage, false);
      }
      return;
    }

    if (p.target && !p.target.dead) {
      this.damage(p.target, p.damage, false);
      if (p.slow) {
        p.target.slow = Math.max(p.target.slow, p.slow);
        p.target.slowTimer = p.slowTime;
      }
    }
  };

  Sim.prototype._cull = function () {
    for (var i = this.enemies.length - 1; i >= 0; i--) {
      if (this.enemies[i].dead) this.enemies.splice(i, 1);
    }
  };

  /* ---------------- save ---------------- */

  Sim.prototype.toJSON = function () {
    return {
      wave: this.wave, hp: this.hp, gold: this.gold,
      levels: this.levels, kills: this.kills, earned: this.earned,
      overcharge: this.overcharge, over: this.over
    };
  };

  Sim.prototype.load = function (data) {
    if (!data) return false;
    this.reset();
    this.wave = Math.max(0, Math.floor(Number(data.wave) || 0));
    this.hp = clamp(Number(data.hp) || this.maxHp, 0, this.maxHp);
    this.gold = Math.max(0, Number(data.gold) || 0);
    this.kills = Math.max(0, Math.floor(Number(data.kills) || 0));
    this.earned = Math.max(0, Number(data.earned) || 0);
    this.overcharge = clamp(Number(data.overcharge) || 0, 0, this.overchargeMax());
    this.over = !!data.over;

    this.levels.tap = Math.max(0, Math.floor(Number(data.levels && data.levels.tap) || 0));
    for (var i = 0; i < NS.TOWERS.length; i++) {
      var id = NS.TOWERS[i].id;
      this.levels[id] = Math.max(0, Math.floor(Number(data.levels && data.levels[id]) || 0));
