<script>
/**
 * LAST KEEP — effects layer. Visual only; the simulation never reads it.
 */
(function (NS) {
  'use strict';

  var rand = NS.rand;
  var clamp = NS.clamp;

  var MAX_PARTICLES = 260;
  var MAX_NUMBERS = 26;
  var MAX_BOLTS = 24;
  var MAX_RINGS = 20;

  function Fx() {
    this.particles = [];
    this.numbers = [];
    this.bolts = [];      // tesla arcs and tracer lines
    this.rings = [];

    this.shake = 0;
    this.shakeX = 0;
    this.shakeY = 0;
    this.flash = 0;
    this.flashColor = '255,80,80';
    this.hitstop = 0;
    this.danger = 0;      // red vignette, rises as the castle is hurt
    this.time = 0;
  }

  Fx.prototype.burst = function (x, y, color, count, power) {
    for (var i = 0; i < count; i++) {
      if (this.particles.length >= MAX_PARTICLES) this.particles.shift();
      var a = Math.random() * Math.PI * 2;
      var speed = rand(0.06, 0.3) * (power || 1);
      this.particles.push({
        x: x, y: y,
        vx: Math.cos(a) * speed,
        vy: Math.sin(a) * speed,
        life: 0, maxLife: rand(0.25, 0.6),
        size: rand(0.003, 0.008) * (power || 1),
        color: color
      });
    }
  };

  Fx.prototype.number = function (x, y, text, color, big) {
    if (this.numbers.length >= MAX_NUMBERS) this.numbers.shift();
    this.numbers.push({
      x: x, y: y, text: text, color: color,
      life: 0, maxLife: big ? 1.1 : 0.75,
      scale: big ? 1.5 : 1,
      vy: -0.12
    });
  };

  Fx.prototype.bolt = function (x, y, tx, ty, color, width) {
    if (this.bolts.length >= MAX_BOLTS) this.bolts.shift();
    this.bolts.push({
      x: x, y: y, tx: tx, ty: ty, color: color,
      width: width || 0.004, life: 0, maxLife: 0.18
    });
  };

  Fx.prototype.ring = function (x, y, maxR, color, width) {
    if (this.rings.length >= MAX_RINGS) this.rings.shift();
    this.rings.push({ x: x, y: y, r: 0, maxR: maxR, color: color, width: width || 0.004 });
  };

  /* ---- named moments ---- */

  Fx.prototype.hit = function (x, y, color, killed) {
    this.burst(x, y, color, killed ? 12 : 4, killed ? 1.3 : 0.7);
    if (killed) this.ring(x, y, 0.05, color, 0.004);
  };

  Fx.prototype.tap = function (x, y, hit) {
    this.ring(x, y, hit ? 0.07 : 0.045, hit ? 'rgba(255,240,200,0.9)' : 'rgba(255,255,255,0.35)', 0.005);
    if (hit) this.shake = Math.min(this.shake + 0.004, 0.03);
  };

  Fx.prototype.leak = function (x, y) {
    this.shake = Math.min(this.shake + 0.05, 0.09);
    this.flash = Math.min(this.flash + 0.4, 0.8);
    this.flashColor = '255,60,60';
    this.burst(x, y, '#ff5a5a', 18, 1.5);
    this.ring(x, y, 0.18, 'rgba(255,80,80,0.9)', 0.008);
  };

  Fx.prototype.bossDown = function (x, y) {
    this.hitstop = Math.max(this.hitstop, 0.16);
    this.shake = Math.min(this.shake + 0.09, 0.13);
    this.flash = Math.min(this.flash + 0.7, 0.9);
    this.flashColor = '255,200,120';
    this.burst(x, y, '#ffd27f', 70, 2.2);
    this.ring(x, y, 0.5, 'rgba(255,220,150,1)', 0.012);
    this.ring(x, y, 0.8, 'rgba(255,120,80,0.8)', 0.02);
  };

  Fx.prototype.overcharge = function () {
    this.hitstop = Math.max(this.hitstop, 0.12);
    this.shake = Math.min(this.shake + 0.08, 0.12);
    this.flash = Math.min(this.flash + 0.8, 0.95);
    this.flashColor = '190,230,255';
    this.ring(0.5, 0.55, 1.4, 'rgba(210,240,255,1)', 0.02);
  };

  /* ---- step ---- */

  Fx.prototype.update = function (dt, hpFraction) {
    this.time += dt;
    var i, p;

    for (i = this.particles.length - 1; i >= 0; i--) {
      p = this.particles[i];
      p.life += dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vx *= 0.92;
      p.vy = p.vy * 0.92 + 0.06 * dt;
      if (p.life >= p.maxLife) this.particles.splice(i, 1);
    }

    for (i = this.numbers.length - 1; i >= 0; i--) {
      p = this.numbers[i];
      p.life += dt;
      p.y += p.vy * dt;
      p.vy *= 0.95;
      if (p.life >= p.maxLife) this.numbers.splice(i, 1);
    }

    for (i = this.bolts.length - 1; i >= 0; i--) {
      p = this.bolts[i];
      p.life += dt;
      if (p.life >= p.maxLife) this.bolts.splice(i, 1);
    }

    for (i = this.rings.length - 1; i >= 0; i--) {
      p = this.rings[i];
      p.r += (p.maxR / 0.35) * dt;
      if (p.r >= p.maxR) this.rings.splice(i, 1);
    }

    this.shake *= Math.pow(0.0008, dt);
    if (this.shake < 0.0006) this.shake = 0;
    this.shakeX = rand(-1, 1) * this.shake;
    this.shakeY = rand(-1, 1) * this.shake;

    this.flash *= Math.pow(0.004, dt);
    if (this.flash < 0.004) this.flash = 0;

    // The screen edges redden as the keep gets closer to falling.
    var target = clamp(1 - hpFraction, 0, 1);
    this.danger += (target - this.danger) * Math.min(1, dt * 2);
  };

  Fx.prototype.clear = function () {
    this.particles.length = 0;
    this.numbers.length = 0;
    this.bolts.length = 0;
    this.rings.length = 0;
    this.shake = this.flash = this.hitstop = 0;
  };

  NS.Fx = Fx;
})(window.SIEGE);
</script>

<script>
/**
 * LAST KEEP — compact WebAudio synth. No assets, no network.
 */
(function (NS) {
  'use strict';

  function Audio() {
    this.ctx = null;
    this.master = null;
    this.noise = null;
    this.enabled = true;
    this.voices = 0;
    this.maxVoices = 6;
  }

  Audio.prototype.init = function () {
    if (this.ctx) return;
    var Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return;
    this.ctx = new Ctx();
    this.master = this.ctx.createGain();
    this.master.gain.value = 0.45;
    this.master.connect(this.ctx.destination);

    var len = Math.floor(this.ctx.sampleRate * 0.5);
    var buf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
    var data = buf.getChannelData(0);
    for (var i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
    this.noise = buf;
  };

  Audio.prototype.unlock = function () {
    this.init();
    if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
  };

  Audio.prototype.setEnabled = function (on) {
    this.enabled = !!on;
    if (this.master) this.master.gain.value = this.enabled ? 0.45 : 0;
  };

  Audio.prototype.frame = function () { this.voices = 0; };

  Audio.prototype._ready = function () {
    return this.enabled && this.ctx && this.ctx.state === 'running';
  };

  /** Short blip; `type` picks the character. */
  Audio.prototype.tone = function (freq, dur, type, gain, sweepTo) {
    if (!this._ready() || this.voices >= this.maxVoices) return;
    this.voices++;
    var ctx = this.ctx, t = ctx.currentTime;

    var osc = ctx.createOscillator();
    osc.type = type || 'square';
    osc.frequency.setValueAtTime(freq, t);
    if (sweepTo) osc.frequency.exponentialRampToValueAtTime(sweepTo, t + dur);

    var g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(gain || 0.2, t + 0.006);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);

    osc.connect(g); g.connect(this.master);
    osc.start(t); osc.stop(t + dur + 0.02);
  };

  Audio.prototype.burst = function (dur, from, to, gain) {
    if (!this._ready() || this.voices >= this.maxVoices) return;
    this.voices++;
    var ctx = this.ctx, t = ctx.currentTime;

    var src = ctx.createBufferSource();
    src.buffer = this.noise;
    var bp = ctx.createBiquadFilter();
    bp.type = 'bandpass';
    bp.Q.value = 1.4;
    bp.frequency.setValueAtTime(from, t);
    bp.frequency.exponentialRampToValueAtTime(to, t + dur);

    var g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(gain || 0.3, t + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);

    src.connect(bp); bp.connect(g); g.connect(this.master);
    src.start(t); src.stop(t + dur + 0.02);
  };

  Audio.prototype.shoot = function (tower) {
    if (tower === 'mortar') this.burst(0.14, 900, 180, 0.22);
    else if (tower === 'tesla') this.tone(1400, 0.06, 'sawtooth', 0.1, 2600);
    else if (tower === 'frost') this.tone(900, 0.08, 'sine', 0.1, 1500);
    else this.tone(320, 0.07, 'square', 0.12, 160);
  };

  /** Kill blip — pitch climbs with the tap combo, so a streak sings. */
  Audio.prototype.kill = function (combo) {
    var step = Math.min(combo || 0, 20);
    this.tone(420 * Math.pow(2, step / 24), 0.09, 'triangle', 0.16, 220);
  };

  Audio.prototype.tap = function (hit, combo) {
    if (!hit) { this.tone(180, 0.04, 'sine', 0.05); return; }
    this.tone(600 + Math.min(combo, 20) * 40, 0.05, 'square', 0.1);
  };

  Audio.prototype.leak = function () {
    this.burst(0.4, 500, 60, 0.45);
    this.tone(90, 0.35, 'sawtooth', 0.3, 40);
  };

  Audio.prototype.wave = function (boss) {
    if (boss) {
      this.tone(70, 0.9, 'sawtooth', 0.4, 40);
      this.tone(140, 0.7, 'square', 0.2, 90);
    } else {
      this.tone(300, 0.16, 'triangle', 0.16, 450);
    }
  };

  Audio.prototype.overcharge = function () {
    this.burst(0.6, 200, 6000, 0.5);
    this.tone(160, 0.7, 'sine', 0.4, 30);
  };

  Audio.prototype.buy = function () {
    this.tone(700, 0.05, 'square', 0.12);
    this.tone(1050, 0.08, 'square', 0.1);
  };

  Audio.prototype.over = function () {
    this.tone(220, 1.2, 'sawtooth', 0.35, 55);
  };

  NS.Audio = Audio;
})(window.SIEGE);
</script>

<script>
/**
 * LAST KEEP — canvas renderer, top-down.
 *
 * Maps the simulation's 0..1 field onto the stage and draws it: the approach,
 * the enemies walking down it, the towers, and the wall at the bottom.
 */
(function (NS) {
  'use strict';

  var C = NS.CONFIG;
  var clamp = NS.clamp;

  var SPRITE = 128;

  function glowSprite(rgb) {
    var c = document.createElement('canvas');
    c.width = c.height = SPRITE;
    var g = c.getContext('2d');
    var r = SPRITE / 2;
    var grad = g.createRadialGradient(r, r, 0, r, r, r);
    grad.addColorStop(0, 'rgba(' + rgb + ',0.9)');
    grad.addColorStop(0.4, 'rgba(' + rgb + ',0.3)');
    grad.addColorStop(1, 'rgba(' + rgb + ',0)');
    g.fillStyle = grad;
    g.fillRect(0, 0, SPRITE, SPRITE);
    return c;
  }

  function Renderer(canvas, sim, fx) {
    this.canvas = canvas;
    this.ctx = canvas.getContext('2d');
    this.sim = sim;
    this.fx = fx;

    this.glow = glowSprite('255,220,160');
    this.glowRed = glowSprite('255,90,90');

    this.resize();
    if (window.ResizeObserver) {
      var self = this;
      this._ro = new ResizeObserver(function () { self.resize(); });
      this._ro.observe(canvas);
    }
  }

  Renderer.prototype.resize = function () {
    var rect = this.canvas.getBoundingClientRect();
    this.dpr = Math.min(window.devicePixelRatio || 1, 2.5);
    this.w = Math.max(1, Math.round(rect.width));
    this.h = Math.max(1, Math.round(rect.height));
    this.canvas.width = Math.round(this.w * this.dpr);
    this.canvas.height = Math.round(this.h * this.dpr);

    // The field keeps its aspect: as wide as the stage, as tall as it needs.
    this.fw = this.w;
    this.fh = this.h;
    this.ox = 0;
    this.oy = 0;
  };

  Renderer.prototype.px = function (x) { return this.ox + x * this.fw; };
  Renderer.prototype.py = function (y) { return this.oy + y * this.fh; };
  /** Sizes are expressed in field-width units so shapes stay proportional. */
  Renderer.prototype.ps = function (s) { return s * this.fw; };

  Renderer.prototype.toField = function (px, py) {
    return { x: (px - this.ox) / this.fw, y: (py - this.oy) / this.fh };
  };

  Renderer.prototype.draw = function (now) {
    var ctx = this.ctx, fx = this.fx, sim = this.sim;

    ctx.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
    ctx.clearRect(0, 0, this.w, this.h);

    ctx.save();
    ctx.translate(fx.shakeX * this.fw, fx.shakeY * this.fw);

    this.drawGround(ctx, now);
    this.drawCastle(ctx);
    this.drawTowers(ctx, now);
    this.drawProjectiles(ctx);
    this.drawEnemies(ctx, now);
    this.drawBolts(ctx);
    this.drawRings(ctx);
    this.drawParticles(ctx);
    this.drawNumbers(ctx);

    ctx.restore();

    this.drawVignette(ctx);
    this.drawFlash(ctx);
  };

  /* ---------------- ground ---------------- */

  Renderer.prototype.drawGround = function (ctx, now) {
    var g = ctx.createLinearGradient(0, 0, 0, this.h);
    g.addColorStop(0, '#0b0f1a');
    g.addColorStop(0.55, '#0d1016');
    g.addColorStop(1, '#141017');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, this.w, this.h);

    // Slow scrolling lanes give the march a direction even when the field is empty.
    var scroll = (now * 0.00004) % 0.1;
    ctx.strokeStyle = 'rgba(255,255,255,0.028)';
    ctx.lineWidth = 1;
    for (var y = -0.1 + scroll; y < 1; y += 0.1) {
      ctx.beginPath();
      ctx.moveTo(0, this.py(y));
      ctx.lineTo(this.w, this.py(y));
      ctx.stroke();
    }
    for (var x = 0.1; x < 1; x += 0.2) {
      ctx.beginPath();
      ctx.moveTo(this.px(x), 0);
      ctx.lineTo(this.px(x), this.py(C.CASTLE_Y));
      ctx.stroke();
    }
  };

  /* ---------------- castle ---------------- */

  Renderer.prototype.drawCastle = function (ctx) {
    var sim = this.sim;
    var y = this.py(C.CASTLE_Y);
    var frac = clamp(sim.hp / sim.maxHp, 0, 1);

    // danger glow rising off the wall
    if (this.fx.danger > 0.02) {
      var glow = ctx.createLinearGradient(0, y - this.ps(0.25), 0, y);
      glow.addColorStop(0, 'rgba(255,60,60,0)');
      glow.addColorStop(1, 'rgba(255,60,60,' + (0.22 * this.fx.danger).toFixed(3) + ')');
      ctx.fillStyle = glow;
      ctx.fillRect(0, y - this.ps(0.25), this.w, this.ps(0.25));
    }

    ctx.fillStyle = '#1b1a22';
    ctx.fillRect(0, y, this.w, this.h - y);

    // battlements
    var bw = this.w / 14;
    ctx.fillStyle = '#252430';
    for (var i = 0; i < 14; i += 2) {
      ctx.fillRect(i * bw, y - this.ps(0.018), bw, this.ps(0.018));
    }

    // wall line, tinted by how much health is left
    var hue = 120 * frac;
    ctx.strokeStyle = 'hsla(' + hue.toFixed(0) + ', 70%, 55%, 0.85)';
    ctx.lineWidth = Math.max(2, this.ps(0.006));
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(this.w, y);
    ctx.stroke();
  };

  /* ---------------- towers ---------------- */

  Renderer.prototype.drawTowers = function (ctx, now) {
    var sim = this.sim;

    for (var i = 0; i < sim.towers.length; i++) {
      var t = sim.towers[i];
      var def = t.def;
      var level = sim.level(def.id);
      var x = this.px(def.x), y = this.py(def.y);
      var r = this.ps(0.032 + Math.min(level, 20) * 0.0008);

      // Range, faint. The simulation measures distance in field units, where a
      // tall stage compresses y — so the honest shape on screen is an ellipse,
      // not a circle, or the ring would understate the tower's vertical reach.
      var range = def.range(level);
      ctx.strokeStyle = 'rgba(255,255,255,0.05)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.ellipse(x, y, range * this.fw, range * this.fh, 0, 0, Math.PI * 2);
      ctx.stroke();

      if (t.flash > 0) {
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        ctx.globalAlpha = t.flash * 0.55;
        ctx.drawImage(this.glow, x - r * 3, y - r * 3, r * 6, r * 6);
        ctx.restore();
      }

      // base
      ctx.save();
      ctx.translate(x, y);
      ctx.fillStyle = '#181820';
      ctx.strokeStyle = def.color;
      ctx.lineWidth = Math.max(1.5, r * 0.16);
      ctx.beginPath();
      for (var s = 0; s < 6; s++) {
        var a = (s / 6) * Math.PI * 2 - Math.PI / 2;
        var pxx = Math.cos(a) * r, pyy = Math.sin(a) * r;
        if (s === 0) ctx.moveTo(pxx, pyy); else ctx.lineTo(pxx, pyy);
      }
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      // barrel pointing at the current target
      ctx.rotate(t.target ? t.angle : -Math.PI / 2);
      ctx.fillStyle = def.color;
      ctx.fillRect(0, -r * 0.2, r * (1.5 + t.flash * 0.35), r * 0.4);
      ctx.restore();
    }
  };

  /* ---------------- enemies ---------------- */

  Renderer.prototype.drawEnemies = function (ctx, now) {
    var sim = this.sim;
    var t = now * 0.001;

    for (var i = 0; i < sim.enemies.length; i++) {
      var e = sim.enemies[i];
      var x = this.px(e.x), y = this.py(e.y);
      var r = this.ps(e.def.size);
      var alpha = e.phased ? 0.32 : 1;

      ctx.save();
      ctx.globalAlpha = alpha;

      // glow — bosses and hurt enemies burn brighter
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      ctx.globalAlpha = alpha * (e.boss ? 0.75 : 0.4) + e.hitFlash * 0.5;
      var sprite = e.boss ? this.glowRed : this.glow;
      ctx.drawImage(sprite, x - r * 3.2, y - r * 3.2, r * 6.4, r * 6.4);
      ctx.restore();

      ctx.translate(x, y);
      ctx.fillStyle = e.hitFlash > 0.05 ? '#ffffff' : e.def.color;
      ctx.strokeStyle = 'rgba(0,0,0,0.5)';
      ctx.lineWidth = Math.max(1, r * 0.12);

      this.enemyShape(ctx, e, r, t);

      // a phased enemy shows a dashed ring: towers cannot touch it, you can
      if (e.phased) {
        ctx.globalAlpha = 0.9;
        ctx.strokeStyle = e.def.color;
        ctx.lineWidth = Math.max(1, r * 0.14);
        ctx.setLineDash([r * 0.5, r * 0.5]);
        ctx.beginPath();
        ctx.arc(0, 0, r * 1.6, t * 2, t * 2 + Math.PI * 2);
        ctx.stroke();
        ctx.setLineDash([]);
      }

      if (e.slow > 0) {
        ctx.strokeStyle = 'rgba(150,225,255,0.75)';
        ctx.lineWidth = Math.max(1, r * 0.12);
        ctx.beginPath();
        ctx.arc(0, 0, r * 1.35, 0, Math.PI * 2);
        ctx.stroke();
      }

      ctx.restore();

      // health bar once it has been hurt
      if (e.hp < e.maxHp) {
        var w = r * (e.boss ? 4 : 2.6);
        var h = Math.max(2, r * 0.22);
        var frac = clamp(e.hp / e.maxHp, 0, 1);
        ctx.fillStyle = 'rgba(0,0,0,0.55)';
        ctx.fillRect(x - w / 2, y - r * 1.9 - h, w, h);
        ctx.fillStyle = e.boss ? '#ff4d6d' : '#8bf5a0';
        ctx.fillRect(x - w / 2, y - r * 1.9 - h, w * frac, h);
      }
    }
  };

  /** One shape per role, so the threat reads at a glance. */
  Renderer.prototype.enemyShape = function (ctx, e, r, t) {
    ctx.beginPath();
    switch (e.type) {
      case 'runner':                       // dart
        ctx.moveTo(0, r * 1.3);
        ctx.lineTo(-r * 0.75, -r * 0.9);
        ctx.lineTo(0, -r * 0.4);
        ctx.lineTo(r * 0.75, -r * 0.9);
        break;
      case 'tank':                         // blunt square
        ctx.rect(-r, -r * 0.85, r * 2, r * 1.7);
        break;
      case 'brute':                        // heavy hexagon
        for (var i = 0; i < 6; i++) {
          var a = (i / 6) * Math.PI * 2;
          var px = Math.cos(a) * r * 1.1, py = Math.sin(a) * r * 1.1;
          if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
        }
        break;
      case 'phantom':                      // diamond
        ctx.moveTo(0, -r * 1.3);
        ctx.lineTo(r, 0);
        ctx.lineTo(0, r * 1.3);
        ctx.lineTo(-r, 0);
        break;
      case 'boss':                         // spiked star
        var spikes = 8;
        for (var s = 0; s < spikes * 2; s++) {
          var ang = (s / (spikes * 2)) * Math.PI * 2 + t * 0.6;
          var rad = s % 2 ? r * 0.62 : r * 1.25;
          var bx = Math.cos(ang) * rad, by = Math.sin(ang) * rad;
          if (s === 0) ctx.moveTo(bx, by); else ctx.lineTo(bx, by);
        }
        break;
      default:                             // grunt / swarm: triangle facing down
        ctx.moveTo(0, r * 1.15);
        ctx.lineTo(-r, -r * 0.8);
        ctx.lineTo(r, -r * 0.8);
    }
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
  };

  /* ---------------- projectiles & effects ---------------- */

  Renderer.prototype.drawProjectiles = function (ctx) {
    var list = this.sim.projectiles;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (var i = 0; i < list.length; i++) {
      var p = list[i];
      var x = this.px(p.x), y = this.py(p.y);
      var r = this.ps(p.kind === 'splash' ? 0.011 : 0.006);
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 0.35;
      ctx.drawImage(this.glow, x - r * 4, y - r * 4, r * 8, r * 8);
      ctx.globalAlpha = 1;
    }
    ctx.restore();
  };

  Renderer.prototype.drawBolts = function (ctx) {
    var list = this.fx.bolts;
    if (!list.length) return;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.lineCap = 'round';
    for (var i = 0; i < list.length; i++) {
      var b = list[i];
      var fade = 1 - b.life / b.maxLife;
      ctx.strokeStyle = b.color;
      ctx.globalAlpha = fade;
      ctx.lineWidth = Math.max(1, this.ps(b.width) * (0.5 + fade));
      ctx.beginPath();
      ctx.moveTo(this.px(b.x), this.py(b.y));
      ctx.lineTo(this.px(b.tx), this.py(b.ty));
      ctx.stroke();
    }
    ctx.restore();
  };

  Renderer.prototype.drawRings = function (ctx) {
    var list = this.fx.rings;
    if (!list.length) return;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (var i = 0; i < list.length; i++) {
      var r = list[i];
      var fade = 1 - clamp(r.r / r.maxR, 0, 1);
      ctx.strokeStyle = r.color;
      ctx.globalAlpha = fade * fade;
      ctx.lineWidth = Math.max(1, this.ps(r.width) * (0.4 + fade));
      ctx.beginPath();
      ctx.arc(this.px(r.x), this.py(r.y), Math.max(1, this.ps(r.r)), 0, Math.PI * 2);
      ctx.stroke();
    }
    ctx.restore();
  };

  Renderer.prototype.drawParticles = function (ctx) {
    var list = this.fx.particles;
    if (!list.length) return;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (var i = 0; i < list.length; i++) {
      var p = list[i];
      var fade = 1 - p.life / p.maxLife;
      ctx.fillStyle = p.color;
      ctx.globalAlpha = fade;
      ctx.beginPath();
      ctx.arc(this.px(p.x), this.py(p.y), Math.max(0.6, this.ps(p.size) * (0.4 + fade)), 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  };

  Renderer.prototype.drawNumbers = function (ctx) {
    var list = this.fx.numbers;
    if (!list.length) return;
    ctx.save();
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    for (var i = 0; i < list.length; i++) {
      var n = list[i];
      var t = n.life / n.maxLife;
      var alpha = t < 0.12 ? t / 0.12 : 1 - (t - 0.12) / 0.88;
      var size = Math.max(10, this.ps(0.032) * n.scale);
      ctx.font = '800 ' + size.toFixed(1) + 'px ui-rounded, "SF Pro Rounded", system-ui, sans-serif';
      ctx.lineWidth = Math.max(2, size * 0.18);
      ctx.strokeStyle = 'rgba(0,0,0,' + (clamp(alpha, 0, 1) * 0.7).toFixed(3) + ')';
      ctx.strokeText(n.text, this.px(n.x), this.py(n.y));
      ctx.fillStyle = n.color.replace('ALPHA', clamp(alpha, 0, 1).toFixed(3));
      ctx.fillText(n.text, this.px(n.x), this.py(n.y));
    }
    ctx.restore();
  };

  /* ---------------- overlays ---------------- */

  Renderer.prototype.drawVignette = function (ctx) {
    var d = this.fx.danger;
    if (d < 0.05) return;
    var g = ctx.createRadialGradient(this.w / 2, this.h / 2, this.w * 0.3,
                                     this.w / 2, this.h / 2, this.w * 0.85);
    g.addColorStop(0, 'rgba(255,0,0,0)');
    g.addColorStop(1, 'rgba(255,0,0,' + (0.35 * d).toFixed(3) + ')');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, this.w, this.h);
  };

  Renderer.prototype.drawFlash = function (ctx) {
    if (this.fx.flash <= 0) return;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = 'rgba(' + this.fx.flashColor + ',' + (this.fx.flash * 0.35).toFixed(3) + ')';
    ctx.fillRect(0, 0, this.w, this.h);
    ctx.restore();
  };

  NS.Renderer = Renderer;
})(window.SIEGE);
</script>

<script>
/**
 * LAST KEEP — DOM layer: HUD, upgrade buttons, overlays.
 */
(function (NS) {
  'use strict';

  var fmt = NS.fmt;
  var clamp = NS.clamp;

  function UI(sim, meta, handlers) {
    this.sim = sim;
    this.meta = meta;
    this.handlers = handlers;

    this.el = {
      wave: document.getElementById('wave'),
      waveSub: document.getElementById('waveSub'),
      gold: document.getElementById('gold'),
      relics: document.getElementById('relics'),
      hpBar: document.getElementById('hpBar'),
      hpText: document.getElementById('hpText'),
      banner: document.getElementById('banner'),
      combo: document.getElementById('combo'),
      bossWrap: document.getElementById('bossWrap'),
      bossBar: document.getElementById('bossBar'),
      charge: document.getElementById('charge'),
      chargeFill: document.getElementById('chargeFill'),
      chargeLabel: document.getElementById('chargeLabel'),
      upgrades: document.getElementById('upgrades'),
      callWave: document.getElementById('callWave'),
      over: document.getElementById('over'),
      overSummary: document.getElementById('overSummary'),
      shop: document.getElementById('shop'),
      shopRelics: document.getElementById('shopRelics'),
      shopList: document.getElementById('shopList')
    };

    this.rows = {};
    this._chargeReady = null;
    this.goldPunch = 0;

    this.buildUpgrades();
    this.bind();
  }

  UI.prototype.bind = function () {
    var self = this;
    this.el.charge.addEventListener('click', function () { self.handlers.onOvercharge(); });
    this.el.callWave.addEventListener('click', function () { self.handlers.onCallWave(); });
    document.getElementById('shopBtn').addEventListener('click', function () { self.openShop(); });
    document.getElementById('shopClose').addEventListener('click', function () {
      self.el.shop.hidden = true;
    });
    document.getElementById('again').addEventListener('click', function () {
      self.el.over.hidden = true;
      self.openShop();
      self.handlers.onRestart();
    });
  };

  UI.prototype.anyPanelOpen = function () {
    return !this.el.over.hidden || !this.el.shop.hidden;
  };

  /* ---------------- upgrade buttons ---------------- */

  UI.prototype.buildUpgrades = function () {
    var self = this;
    var defs = [NS.TAP_UPGRADE].concat(NS.TOWERS);
    var frag = document.createDocumentFragment();

    defs.forEach(function (def) {
      var btn = document.createElement('button');
      btn.className = 'up';
      btn.type = 'button';
      btn.innerHTML = '<span class="up-dot"></span><span class="up-name"></span>' +
                      '<span class="up-lvl"></span><span class="up-cost"></span>' +
                      '<span class="up-bar"></span>';
      btn.querySelector('.up-name').textContent = def.name;
      btn.querySelector('.up-dot').style.background = def.color || '#ffcf5c';

      btn.addEventListener('click', function () {
        if (!self.sim.canBuy(def.id)) return;
        self.handlers.onBuy(def.id);
        btn.classList.remove('flash');
        void btn.offsetWidth;
        btn.classList.add('flash');
      });

      self.rows[def.id] = {
        def: def, btn: btn,
        lvl: btn.querySelector('.up-lvl'),
        cost: btn.querySelector('.up-cost'),
        bar: btn.querySelector('.up-bar'),
        lastLevel: -1, lastAfford: null
      };
      frag.appendChild(btn);
    });

    this.el.upgrades.appendChild(frag);
  };

  /* ---------------- per-frame ---------------- */

  UI.prototype.update = function (dt) {
    var sim = this.sim;

    this.el.wave.textContent = 'WAVE ' + Math.max(1, sim.wave);
    this.el.wave.classList.toggle('boss', NS.wave.isBoss(sim.wave));
    this.el.waveSub.textContent = sim.over ? 'breached'
      : sim.inWave ? (sim.enemies.length + ' on the field')
      : 'next in ' + Math.max(0, sim.breakTime).toFixed(1) + 's';

    this.el.gold.textContent = fmt(sim.gold);
    this.el.relics.textContent = '◈ ' + fmt(this.meta.relics);

    if (this.goldPunch > 0.001) {
      this.goldPunch *= Math.pow(0.002, dt || 0.016);
      this.el.gold.style.transform = 'scale(' + (1 + this.goldPunch).toFixed(3) + ')';
    } else if (this.goldPunch !== 0) {
      this.goldPunch = 0;
      this.el.gold.style.transform = '';
    }

    var frac = clamp(sim.hp / sim.maxHp, 0, 1);
    this.el.hpBar.style.width = (frac * 100).toFixed(1) + '%';
    this.el.hpBar.className = 'hp-bar' + (frac < 0.3 ? ' critical' : frac < 0.6 ? ' hurt' : '');
    this.el.hpText.textContent = Math.ceil(sim.hp) + ' / ' + sim.maxHp;

    // overcharge
    var chargeFrac = sim.overcharge / sim.overchargeMax();
    this.el.chargeFill.style.width = (chargeFrac * 100).toFixed(1) + '%';
    var ready = sim.overchargeReady();
    if (ready !== this._chargeReady) {
      this._chargeReady = ready;
      this.el.charge.classList.toggle('ready', ready);
      this.el.charge.disabled = !ready;
      this.el.chargeLabel.textContent = ready ? 'OVERCHARGE — FIRE!' : 'OVERCHARGE';
    }

    // combo
    if (sim.combo >= 3) {
      this.el.combo.textContent = '×' + sim.comboMult().toFixed(1) + '  TAP COMBO';
      this.el.combo.className = 'combo on' + (sim.combo >= 12 ? ' hot' : '');
    } else {
      this.el.combo.className = 'combo';
    }

    // boss health
    var boss = null;
    for (var i = 0; i < sim.enemies.length; i++) {
      if (sim.enemies[i].boss) { boss = sim.enemies[i]; break; }
    }
    if (boss) {
      this.el.bossWrap.hidden = false;
      this.el.bossBar.style.width = (clamp(boss.hp / boss.maxHp, 0, 1) * 100).toFixed(1) + '%';
    } else {
      this.el.bossWrap.hidden = true;
    }

    this.el.callWave.classList.toggle('hot', !sim.inWave && !sim.over);

    for (var id in this.rows) {
      if (!this.rows.hasOwnProperty(id)) continue;
      var row = this.rows[id];
      var level = sim.level(id);
      var cost = sim.cost(id);
      var afford = sim.gold >= cost && !sim.over;

      if (level !== row.lastLevel) {
        row.lvl.textContent = 'LV ' + level;
        row.lastLevel = level;
      }
      row.cost.textContent = fmt(cost);
      if (afford !== row.lastAfford) {
        row.btn.disabled = !afford;
        row.lastAfford = afford;
      }
      row.bar.style.width = (Math.min(1, sim.gold / cost) * 100).toFixed(1) + '%';
    }
  };

  UI.prototype.bumpGold = function (strength) {
    this.goldPunch = Math.min(this.goldPunch + (strength || 0.06), 0.35);
  };

  UI.prototype.banner = function (text, boss) {
    var el = this.el.banner;
    el.textContent = text;
    el.className = 'banner';
    void el.offsetWidth;
    el.className = 'banner go' + (boss ? ' boss' : '');
  };

  /* ---------------- overlays ---------------- */

  UI.prototype.showGameOver = function (wave, gain, stats) {
    this.el.overSummary.innerHTML =
      '<div class="row"><span>Wave reached</span><span>' + wave + '</span></div>' +
      '<div class="row"><span>Enemies killed</span><span>' + stats.kills + '</span></div>' +
      '<div class="row"><span>Gold earned</span><span>' + fmt(stats.earned) + '</span></div>' +
      '<div class="row"><span>Best ever</span><span>wave ' + this.meta.bestWave + '</span></div>' +
      '<div class="big">◈ ' + gain + '</div>';
    this.el.over.hidden = false;
  };

  UI.prototype.openShop = function () {
    var self = this;
    var meta = this.meta;
    var list = this.el.shopList;

    this.el.shopRelics.innerHTML = '◈ ' + fmt(meta.relics) +
      '<div class="shop-next">best wave ' + meta.bestWave + ' · ' + meta.runs + ' runs · ' +
      fmt(meta.lifetime) + ' relics all-time</div>';

    list.innerHTML = '';
    NS.META.UPGRADES.forEach(function (def) {
      var lvl = meta.level(def.id);
      var maxed = meta.maxed(def.id);
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'shop-row';
      btn.disabled = !meta.canBuy(def.id);
      btn.innerHTML = '<span><span class="sn"></span><br><span class="sd"></span><br>' +
                      '<span class="sv"></span></span><span class="sc"></span>';
      btn.querySelector('.sn').textContent = def.name;
      btn.querySelector('.sd').textContent = def.desc;
      btn.querySelector('.sv').textContent = 'LV ' + lvl + ' · ' + def.format(lvl);
      btn.querySelector('.sc').textContent = maxed ? 'MAX' : '◈ ' + fmt(meta.cost(def.id));
      btn.addEventListener('click', function () {
        if (meta.buy(def.id)) {
          self.handlers.onMetaBuy();
          self.openShop();
        }
      });
      list.appendChild(btn);
    });

    this.el.shop.hidden = false;
  };

  NS.UI = UI;
})(window.SIEGE);
</script>

<script>
/**
 * LAST KEEP — localStorage. Never lets a bad save stop the game starting.
 */
(function (NS) {
  'use strict';

  var KEY = 'lastkeep.save.v1';
  var SOUND_KEY = 'lastkeep.sound';

  NS.Save = {
    write: function (sim, meta) {
      try {
        localStorage.setItem(KEY, JSON.stringify({
          v: 1, run: sim.toJSON(), meta: meta.toJSON(), at: Date.now()
        }));
      } catch (e) { /* private mode / quota */ }
    },

    read: function () {
      try {
        var raw = localStorage.getItem(KEY);
        if (!raw) return null;
        var data = JSON.parse(raw);
        return data && data.v === 1 ? data : null;
      } catch (e) { return null; }
    },

    clear: function () {
      try { localStorage.removeItem(KEY); } catch (e) { /* ignore */ }
    },

    readSound: function () {
      try { return localStorage.getItem(SOUND_KEY) !== 'off'; } catch (e) { return true; }
    },

    writeSound: function (on) {
      try { localStorage.setItem(SOUND_KEY, on ? 'on' : 'off'); } catch (e) { /* ignore */ }
    }
  };
})(window.SIEGE);
</script>

<script>
/**
 * LAST KEEP — bootstrap and game loop.
 */
(function (NS) {
  'use strict';

  var C = NS.CONFIG;
  var STEP = 1 / 60;
  var MAX_STEPS = 5;

  var canvas = document.getElementById('field');

  var meta = new NS.Meta();
  var sim = new NS.Sim(meta);
  var fx = new NS.Fx();
  var audio = new NS.Audio();
  var renderer = new NS.Renderer(canvas, sim, fx);
  var ui = new NS.UI(sim, meta, {
    onBuy: buy,
    onOvercharge: overcharge,
    onCallWave: callWave,
    onRestart: restart,
    onMetaBuy: function () { audio.buy(); NS.Save.write(sim, meta); }
  });

  var acc = 0, lastFrame = 0, saveTimer = 0, fps = 60;

  NS.game = {
    sim: sim, meta: meta, fx: fx, audio: audio, renderer: renderer, ui: ui, canvas: canvas,
    fps: function () { return fps; }
  };

  /* ---------------- start ---------------- */

  var saved = NS.Save.read();
  if (saved) {
    if (saved.meta) meta.load(saved.meta);
    if (saved.run) sim.load(saved.run);
  }
  if (sim.over) sim.reset();       // a finished run never resumes; it restarts

  renderer.resize();
  audio.setEnabled(NS.Save.readSound());
  updateMuteLabel();

  /* ---------------- input ---------------- */

  canvas.addEventListener('pointerdown', function (e) {
    e.preventDefault();
    audio.unlock();
    if (ui.anyPanelOpen()) return;

    var rect = canvas.getBoundingClientRect();
    var p = renderer.toField(e.clientX - rect.left, e.clientY - rect.top);
    sim.tap(p.x, p.y);
  }, { passive: false });

  document.getElementById('mute').addEventListener('click', function () {
    audio.unlock();
    audio.setEnabled(!audio.enabled);
    NS.Save.writeSound(audio.enabled);
    updateMuteLabel();
  });

  window.addEventListener('resize', function () { renderer.resize(); });
  window.addEventListener('orientationchange', function () {
    setTimeout(function () { renderer.resize(); }, 150);
  });
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) NS.Save.write(sim, meta);
    else lastFrame = 0;
  });
  window.addEventListener('pagehide', function () { NS.Save.write(sim, meta); });

  function updateMuteLabel() {
    document.getElementById('mute').textContent = audio.enabled ? 'sound on' : 'sound off';
  }

  function buzz(pattern) {
    if (navigator.vibrate) { try { navigator.vibrate(pattern); } catch (e) { /* ignore */ } }
  }

  /* ---------------- actions ---------------- */

  function buy(id) {
    if (!sim.buy(id)) return;
    audio.buy();
    NS.Save.write(sim, meta);
  }

  function overcharge() {
    if (!sim.fireOvercharge()) return;
    buzz([0, 40, 30, 90]);
  }

  function callWave() {
    if (sim.callEarly()) buzz(20);
  }

  function restart() {
    sim.reset();
    fx.clear();
    NS.Save.write(sim, meta);
  }

  /* ---------------- events ---------------- */

  function drainEvents() {
    var events = sim.events;

    for (var i = 0; i < events.length; i++) {
      var e = events[i];

      switch (e.type) {
        case 'shot':
          audio.shoot(e.tower);
          if (e.tower === 'tesla') {
            fx.bolt(e.x, e.y, e.tx, e.ty, 'rgba(210,170,255,0.95)', 0.005);
          }
          break;

        case 'hit':
          fx.hit(e.x, e.y, e.boss ? '#ff9b9b' : '#ffd9a0', e.killed);
          break;

        case 'kill':
          audio.kill(sim.combo);
          ui.bumpGold(e.boss ? 0.3 : 0.05);
          if (e.boss) {
            fx.bossDown(e.x, e.y);
            ui.banner('BOSS DOWN', true);
            buzz([0, 60, 40, 120]);
          }
          if (e.boss || e.gold >= 12) {
            fx.number(e.x, e.y, '+' + NS.fmt(e.gold), 'rgba(255,207,92,ALPHA)', e.boss);
          }
          break;

        case 'tap':
          fx.tap(e.x, e.y, e.hit);
          audio.tap(e.hit, e.combo);
          if (e.hit && e.combo >= 3 && e.combo % 3 === 0) {
            fx.number(e.x, e.y - 0.03, '×' + sim.comboMult().toFixed(1), 'rgba(255,240,180,ALPHA)');
          }
          break;

        case 'leak':
          fx.leak(e.x, e.y);
          audio.leak();
          buzz([0, 80]);
          break;

        case 'wave':
          fx.flash = Math.min(fx.flash + 0.25, 0.6);
          fx.flashColor = e.boss ? '255,80,100' : '140,190,255';
          ui.banner(e.boss ? 'BOSS WAVE ' + e.n : 'WAVE ' + e.n, e.boss);
          audio.wave(e.boss);
          if (e.boss) buzz([0, 40, 60, 40, 60, 120]);
          break;

        case 'cleared':
          fx.number(0.5, 0.42, '+' + NS.fmt(e.bonus) + ' GOLD', 'rgba(255,207,92,ALPHA)', true);
          ui.bumpGold(0.2);
          NS.Save.write(sim, meta);
          break;

        case 'overcharge':
          fx.overcharge();
          audio.overcharge();
          break;

        case 'over':
          endRun(e.wave);
          break;
      }
    }
    events.length = 0;
  }

  function endRun(wave) {
    var stats = { kills: sim.kills, earned: sim.earned };
    var gain = meta.bank(wave);
    audio.over();
    buzz([0, 120, 60, 200]);
    fx.flash = 0.9;
    fx.flashColor = '255,60,60';
    ui.showGameOver(wave, gain, stats);
    NS.Save.write(sim, meta);
  }

  /* ---------------- loop ---------------- */

  function frame(now) {
    requestAnimationFrame(frame);

    if (!lastFrame) lastFrame = now;
    var dt = (now - lastFrame) / 1000;
    lastFrame = now;
    if (dt > 0.25) dt = 0.25;
    if (dt > 0) fps += (1 / dt - fps) * 0.05;

    audio.frame();

    var paused = ui.anyPanelOpen() || sim.over;

    if (paused) {
      acc = 0;
    } else if (fx.hitstop > 0) {
      fx.hitstop -= dt;
      acc = 0;
    } else {
      acc += dt;
      var steps = 0;
      while (acc >= STEP && steps < MAX_STEPS) {
        sim.update(STEP);
        acc -= STEP;
        steps++;
      }
      if (steps === MAX_STEPS) acc = 0;
    }

    drainEvents();
    fx.update(dt, sim.maxHp ? sim.hp / sim.maxHp : 1);
    ui.update(dt);
    renderer.draw(now);

    saveTimer += dt;
    if (saveTimer >= C.SAVE_INTERVAL) {
      saveTimer = 0;
      if (!sim.over) NS.Save.write(sim, meta);
    }
  }

  requestAnimationFrame(frame);
})(window.SIEGE);
</script>
